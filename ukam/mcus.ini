# UKAM (update_klipper_and_mcus): one command updates Klipper and flashes
# every board that needs it.  https://github.com/fbeauKmi/update_klipper_and_mcus
#
#   cd ~ && git clone https://github.com/fbeauKmi/update_klipper_and_mcus.git ukam
#   ~/ukam/ukam.sh -m      # first run: review each board's menuconfig
#   ~/ukam/ukam.sh         # later runs; boards already up to date are skipped
#
# UKAM reads this file from ~/printer_data/config/ukam/ and keeps each board's
# Kconfig in ukam/config/config.<section>, so firmware settings are versioned
# with the rest of the config. UKAM adds KCONFIG_CONFIG to "make flash" itself.
# Katapult bootloader Kconfigs stay in boards/<board>/ (UKAM builds Klipper only).
#
# RP2040 (SB2040): UKAM warns that Klipper's RP2350 support can corrupt stored
# RP2040 configs. Use -m on the first run and check the SB2040 settings.

# Octopus Pro F446 main board: USB, Katapult bootloader (32 KiB offset)
[octopus]
klipper_section: mcu
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_stm32f446xx_570030001551303432323631-if00

# Mellow SB2040 toolhead: CAN (1 Mbit), Katapult
[sb2040]
klipper_section: mcu toolhead
action_command: ~/klippy-env/bin/python3 ~/katapult/scripts/flashtool.py -i can0 -u 56993da7b11b

# BTT MMB v1.1 (ERCF): CAN (1 Mbit), Katapult. Happy Hare names this MCU "unit0"
[mmb]
klipper_section: mcu unit0
action_command: ~/klippy-env/bin/python3 ~/katapult/scripts/flashtool.py -i can0 -u c2d5f652b572

# Raspberry Pi host MCU
[rpi]
klipper_section: mcu rpi
action_command: make flash

# Beacon (its own firmware, not Klipper)
[beacon]
is_klipper_fw: false
quiet_command: sudo systemctl stop klipper
action_command: git -C ~/beacon_klipper pull
action_command: ~/beacon_klipper/update_firmware.py update all
