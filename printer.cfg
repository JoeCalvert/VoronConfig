# printer.cfg: includes only, plus Klipper's SAVE_CONFIG block below.
# Every file that's loaded is listed here, in one place.

# Happy Hare (its own layout; should be near the top)
[include mmu/base/*.cfg]
[include mmu/macros/*.cfg]
#[include mmu/optional/mmu_menu.cfg]

# Machine settings and shared variables
[include config/variables.cfg]
[include config/machine.cfg]

# Boards
[include config/boards/octopus_pro.cfg]
[include config/boards/sb2040.cfg]
[include config/boards/rpi.cfg]

# Hardware
[include config/hardware/probe.cfg]
[include config/hardware/axes_xy.cfg]
[include config/hardware/axes_z.cfg]
[include config/hardware/extruder.cfg]
[include config/hardware/heated_bed.cfg]
[include config/hardware/temperature_sensors.cfg]
[include config/hardware/fans.cfg]
[include config/hardware/nevermore_filter.cfg]
[include config/hardware/accelerometer.cfg]
[include config/hardware/status_leds.cfg]
[include config/hardware/lights.cfg]

# Software features
[include config/software/bed_mesh.cfg]
[include config/software/qgl.cfg]
[include config/software/input_shaper.cfg]
[include config/software/motors_autotune.cfg]
[include config/software/shaketune.cfg]
[include config/software/test_probe_accuracy.cfg]
#[include config/software/firmware_retraction.cfg]
#[include config/software/settling_probe.cfg]
#[include config/software/thermal_adjust.cfg]   # off until the coefficient is re-measured

# Our macros
[include macros/print/*.cfg]         # START_PRINT, POST_START_PRINT, END_PRINT, NOZZLE_SET
[include macros/motion/*.cfg]        # PARK, conditional homing, sensorless homing, QGL
[include macros/mmu_hooks/*.cfg]     # handlers wired into Happy Hare's user_* hooks
[include macros/state/*.cfg]         # startup check, LED controller
[include macros/accessories/*.cfg]   # filter, case lights, heat soak
[include macros/system/*.cfg]        # config backup, debugging

# Happy Hare client macros (PAUSE, RESUME, CANCEL_PRINT): must stay last
[include mmu/optional/client_macros.cfg]

