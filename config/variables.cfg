# All settings our macros use, in one place. Each macro reads this once:
#   {% set v = printer["gcode_macro _USER_VARIABLES"] %}
#
# Positions that Happy Hare owns (cutter pin, Blobifier tray and brush, pause
# park) are not repeated here: see mmu/base/mmu_macro_vars.cfg and
# docs/state-table.md.

[gcode_macro _USER_VARIABLES]

# --- Motion -----------------------------------------------------------------
variable_travel_speed: 250              # mm/s, macro travel moves
variable_z_drop_speed: 15               # mm/s, macro Z moves

# --- Print start --------------------------------------------------------------
variable_soak_position_xyz: 300, 300, 2  # where the bed soak waits: over the Z home point, near the bed
# Where the chamber soak waits: well away from the bed, so the chamber
# thermistor (on the toolhead) reads the air, not the bed.
variable_chamber_soak_position_xyz: 175, 175, 80
variable_force_homing_in_start_print: False   # True: always re-home in START_PRINT
variable_print_default_bed_temp: 110          # used only if the slicer passes none
variable_print_default_extruder_temp: 240
variable_print_default_soak: 10               # minutes of bed soak when the bed starts cold (a 350 plate keeps moving for a while)
variable_print_default_chamber_max_heating_time: 15   # minutes, chamber soak time limit

# --- Preheat (PREHEAT, MENU -> Preheat) -------------------------------------
# Bed and chamber targets by material, for warming the machine up before a
# print. The slicer still owns the print temperatures; START_PRINT then skips
# the bed soak because the bed is already hot. Check these match your slicer.
variable_preheat_materials: {'PLA': [60, 0], 'PETG': [80, 0], 'ABS': [105, 50], 'ASA': [105, 50], 'PC': [110, 55]}
variable_preheat_nozzle_temp: 150       # warm, but not hot enough to ooze
variable_preheat_max_minutes: 90        # heaters stay on this long, then the idle timeout turns them off

# --- Maintenance (MAINTENANCE) -------------------------------------------------
# Printing hours between each job. Starting points: set your own. The filter
# only counts prints with a chamber temperature (the only ones it runs for);
# the nozzle count restarts when NOZZLE_CHANGE records a new nozzle.
variable_maintenance_items: {
    'filter': ['Replace the Nevermore carbon', 100],
    'lube':   ['Lubricate the rails and check belt tension', 200],
    'nozzle': ['Inspect the nozzle for wear', 300],
  }

# --- Retune (RETUNE) ---------------------------------------------------------
# Where the belt-tension check is done: toolhead centred on X. Adjust Y so the
# gantry's X/Y joint idlers sit about 150 mm from the front idlers (not
# critical, just keep it the same each time).
variable_belt_check_position_xy: 175, 175

# --- Nozzle change (NOZZLE_CHANGE) --------------------------------------------
variable_nozzle_sizes: [0.25, 0.4, 0.5, 0.6, 0.8]   # buttons offered after a Revo nozzle swap

# --- End of job ---------------------------------------------------------------
variable_park_position_xy: 175, 100     # PARK target (X is moved first, see PARK)
variable_park_lift_z: 150               # mm lifted by PARK (capped at max Z)
variable_service_position_xy: 175, 40   # SERVICE_POSITION: front centre, easy to reach the nozzle
variable_service_min_z: 100             # SERVICE_POSITION lifts Z to at least this (never lowers it)
variable_disable_motors_in_end_print: True
variable_part_ready_bed_temp: 40        # after a print, "safe to remove" once the bed is below this

# --- Notifications (_NOTIFY) ---------------------------------------------------
# Name of a [notifier] in moonraker.conf with "events: gcode" (see
# docs/notifications.md). Empty: notifications off.
variable_notifier_name: ""

# --- Chamber, filter and lights ----------------------------------------------
variable_chamber_temperature_sensor_name: "Chamber"   # [temperature_sensor Chamber]
variable_filter_name: "filter"          # [fan_generic filter]
variable_filter_working_speed: 1.0      # while printing with a chamber temperature
variable_light_pin_name: "caselight"    # [led caselight]
variable_light_intensity_start_print: 1.0
variable_light_intensity_printing: 0.8
variable_light_intensity_end_print: 0.0

# --- Toolhead status LEDs ([neopixel _status_leds]) --------------------------
variable_status_leds_logo_idx: '1,2,3,4,5,6,7,8'
variable_status_leds_nozzle_idx: '9,10'
variable_status_leds_colors: {
        'logo': {
            'busy': {'r': 0.4, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'cleaning': {'r': 0.0, 'g': 0.02, 'b': 0.5, 'w': 0.0},
            'calibrating_z': {'r': 0.8, 'g': 0.0, 'b': 0.35, 'w': 0.0},
            'heating': {'r': 0.3, 'g': 0.18, 'b': 0.0, 'w': 0.0},
            'homing': {'r': 0.0, 'g': 0.6, 'b': 0.2, 'w': 0.0},
            'leveling': {'r': 0.5, 'g': 0.1, 'b': 0.4, 'w': 0.0},
            'meshing': {'r': 0.2, 'g': 1.0, 'b': 0.0, 'w': 0.0},
            'on': {'r': 0.8, 'g': 0.8, 'b': 0.8, 'w': 1.0},
            'off': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'printing': {'r': 1.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'standby': {'r': 0.01, 'g': 0.01, 'b': 0.01, 'w': 0.1},
            'error': {'r': 0.6, 'g': 0.0, 'b': 0.0, 'w': 0.0},
        },
        'nozzle': {
            'heating': {'r': 0.8, 'g': 0.35, 'b': 0.0, 'w': 0.0},
            'off': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'on': {'r': 0.8, 'g': 0.8, 'b': 0.8, 'w': 1.0},
            'standby': {'r': 0.6, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'error': {'r': 0.6, 'g': 0.0, 'b': 0.0, 'w': 0.0},
        },
    }

gcode:
