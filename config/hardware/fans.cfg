[fan]
pin: toolhead:FAN0
kick_start_time: 0.100
cycle_time: 0.010

[heater_fan hotend_fan]
pin: toolhead:FAN1
max_power: 1.0
kick_start_time: 0.100
heater: extruder
heater_temp: 50.0

# Electronics bay fan: runs while any stepper is enabled or a heater is on,
# then for idle_timeout (default 30 s). It was a heater_fan tied to the bed at
# 80 C, so it never ran for PLA/PETG prints.
[controller_fan electronics_fan]
pin: FAN1
heater: extruder, heater_bed

