[extruder]
step_pin: toolhead:E_STEP
dir_pin: !toolhead:E_DIR
enable_pin: !toolhead:E_EN
# Happy Hare's values (mmu_macro_vars.cfg sets them too, but this file is
# included later, so whatever is here wins). Loads, purges and tip forming
# need far more than Klipper's defaults.
max_extrude_cross_section: 50

# Galileo 2 (9:1 planetary) with an LDO 36STH20-1004AHG, Revo hotend.
# rotation_distance is calibrated: new = old * actual_extruded / requested.
rotation_distance: 47.32344
gear_ratio: 9:1
microsteps: 32
full_steps_per_rotation: 200
nozzle_diameter: 0.6
filament_diameter: 1.75
heater_pin: toolhead:HE0
sensor_type: ATC Semitec 104NT-4-R025H42G   # Revo HeaterCore thermistor
sensor_pin: toolhead:TH0
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
max_extrude_only_distance: 200
# PID control and its values are in printer.cfg's SAVE_CONFIG block: they're
# measured by the printer (CALIBRATE -> PID), and SAVE_CONFIG stores them there.
# Only a fallback: PrusaSlicer sets pressure advance per filament.
pressure_advance: 0.05
pressure_advance_smooth_time: 0.02   # 0.04 default. 0.02 is about the floor for a good, strong extruder (Voron Discord, docs/discord-evidence.md); go back to 0.03-0.04 if the extruder clicks or skips at high flow. Retune PA after changing it

[tmc2209 extruder]
uart_pin: toolhead:E_TMCUART
interpolate: True
run_current: 0.6
sense_resistor: 0.110
