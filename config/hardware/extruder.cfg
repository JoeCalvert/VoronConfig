[extruder]
step_pin: toolhead:E_STEP
dir_pin: !toolhead:E_DIR
enable_pin: !toolhead:E_EN
max_extrude_cross_section: 5

# Galileo 2 (9:1 planetary) with an LDO 36STH20-1004AHG, Revo hotend.
# rotation_distance is calibrated: new = old * actual_extruded / requested.
rotation_distance: 47.32344
gear_ratio: 9:1
microsteps: 32
full_steps_per_rotation: 200
nozzle_diameter: 0.6
filament_diameter: 1.75
heater_pin: toolhead:HE0
sensor_type: ATC Semitec 104NT-4-R025H42G   # Revo HeaterCore thermistor
sensor_pin: toolhead:TH0
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
max_extrude_only_distance: 120
control = pid
pid_Kp=29.460
pid_Ki=3.507
pid_Kd=61.866
# Only a fallback: PrusaSlicer sets pressure advance per filament.
pressure_advance: 0.05
pressure_advance_smooth_time: 0.04

[tmc2209 extruder]
uart_pin: toolhead:E_TMCUART
interpolate: True
run_current: 0.6
sense_resistor: 0.110
