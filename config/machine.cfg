[printer]
kinematics: corexy
max_velocity: 400
max_accel: 7000
max_z_velocity: 30
max_z_accel: 500
square_corner_velocity: 5.0    # Klipper default. Higher adds input-shaper smoothing; per-feature SCV comes later, from the slicer

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
# Runs when a print stops with an error, before Klipper records the error
# message, so the failed-print dialog is started a second later, once the
# message is available (macros/print/job_recovery.cfg).
on_error_gcode:
    TURN_OFF_HEATERS
    UPDATE_DELAYED_GCODE ID=_JOB_FAILED_LATER DURATION=1

# [pause_resume], [display_status] and [respond] are defined here, and Happy
# Hare's installer also puts them in mmu/base/mmu_macro_vars.cfg. Klipper
# merges same-named sections, so a copy coming back after an update is harmless.
[pause_resume]

[exclude_object]

[display_status]

[respond]

[force_move]
enable_force_move: True

[gcode_arcs]
# resolution: Klipper default (1.0 mm)

