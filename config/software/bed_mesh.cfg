[bed_mesh]
# START_PRINT meshes adaptively (BED_MESH_CALIBRATE ADAPTIVE=1) inside these limits.
speed: 450
# horizontal_move_z: default. Beacon scans at its own trigger distance (2 mm), so this has no effect
# Beacon (probe) coordinates. The coil sits 15.6 mm behind the nozzle, so the
# probe reaches Y 15.6 to past the back edge, and X 0 to 353. These keep it
# about 15 mm inside the 350 mm plate. CHECK BY HAND that Beacon still reads
# the plate at all four edges (docs/config-changes.md, PR #29).
mesh_min: 15, 20
mesh_max: 335, 335
probe_count: 27, 27
zero_reference_position: 300, 300
#fade_end: 10
mesh_pps: 2,2
algorithm: bicubic
