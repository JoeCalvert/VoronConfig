[bed_mesh]
# FOLLOW THE FORUMULA FOR relative_reference_index to be centered, 
# This is only for manual call of BED_MESH_CABLIBRATE all those parameters are overridden on the fly if using the adaptive bed mesh macro
# for example:
# [(9x9)-1] / 2 = 40
# [(7x7)-1] / 2 = 24
# [(5x5)-1] / 2 = 12
speed: 450
# horizontal_move_z: default. Beacon scans at its own trigger distance (2 mm), so this has no effect
mesh_min: 40, 40
mesh_max: 310, 310
probe_count: 27, 27
zero_reference_position: 300, 300
#fade_end: 10
mesh_pps: 2,2
algorithm: bicubic