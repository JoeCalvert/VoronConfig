[quad_gantry_level]
gantry_corners:
	-60,-10
	410,420
# Nozzle coordinates (front-left, back-left, back-right, front-right). Beacon
# probes 15.6 mm behind the nozzle, so it measures at X 25/325, Y 25.6/325.6:
# as far apart as possible while staying ~25 mm inside the plate, because
# wider points level the gantry more accurately. CHECK BY HAND (PR #29).
points:
	25,10
	25,310
	325,310
	325,10
speed: 350
horizontal_move_z: 12
retries: 5
retry_tolerance: 0.0050
max_adjust: 15

[gcode_macro FAST_QGL]
description: Two-pass QGL: a coarse pass at a safe height, then a fine pass at 2 mm
gcode:
    QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1
    QUAD_GANTRY_LEVEL horizontal_move_z=2

[gcode_macro COARSE_QGL]
description: Coarse QGL (1 mm tolerance) at a safe height, for a gantry that may be far out
gcode:
    QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1
