[input_shaper]
# Shaper types and frequencies are in printer.cfg's SAVE_CONFIG block: Klipper's
# SHAPER_CALIBRATE (RETUNE -> Input shaper) measures them, applies them at once
# and stores them there with SAVE_CONFIG. It doesn't store damping ratios, so
# those stay here (from the Shake&Tune graphs, Nov 2024; update after a retune).
damping_ratio_x: 0.053
damping_ratio_y: 0.063
