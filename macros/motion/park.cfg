[gcode_macro PARK]
description: Lift Z, then X, then Y to the park point, accounting for offsets and mesh
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set th = printer.toolhead %}
    {% if th.homed_axes != 'xyz' %}
        RESPOND MSG="PARK skipped: axes are not homed"
    {% else %}
        {% set gm = printer.gcode_move %}
        {% set p = gm.gcode_position %}
        # position - gcode_position includes both SET_GCODE_OFFSET and G92.
        {% set ox = gm.position.x - p.x %}
        {% set oy = gm.position.y - p.y %}
        {% set oz = gm.position.z - p.z %}
        {% set px, py = v.park_position_xy|map('float') %}
        # Mesh compensation can still apply high above the bed. Reserve its
        # largest positive correction plus 0.5 mm before moving across it.
        {% set ns = namespace(mesh=0.0) %}
        {% for row in printer.bed_mesh.mesh_matrix|default([]) if row %}
            {% set ns.mesh = [ns.mesh, row|max]|max %}
        {% endfor %}
        {% set limit = th.axis_maximum.z - oz - ns.mesh - 0.5 %}
        {% set z = [p.z + v.park_lift_z, limit]|min %}
        {% if z < p.z or px < th.axis_minimum.x or px > th.axis_maximum.x or py < th.axis_minimum.y or py > th.axis_maximum.y %}
            RESPOND MSG="PARK skipped: insufficient clearance or park point outside axis limits"
        {% else %}
            SAVE_GCODE_STATE NAME=_park
            G90
            G1 Z{z} F{v.z_drop_speed * 60}
            # X before Y clears the cutter pin when leaving the Blobifier tray.
            G1 X{px - ox} F{v.travel_speed * 60}
            G1 Y{py - oy} F{v.travel_speed * 60}
            RESTORE_GCODE_STATE NAME=_park
        {% endif %}
    {% endif %}
