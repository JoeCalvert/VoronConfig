[gcode_macro PARK]
description: Park the toolhead at the back and retract some filament if the nozzle is hot
gcode:
    {% set E = params.E|default(1.7)|float %}

    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set Px, Py = v.park_position_xy|map('float') %}
    {% set park_lift_z = v.park_lift_z %}
    {% set St = v.travel_speed * 60 %}
    {% set Sz = v.z_drop_speed * 60 %}

    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}

    {% set z_safe = act_z + park_lift_z %}
    {% if z_safe > max_z %}
        {% set z_safe = max_z %}
    {% endif %}

    SAVE_GCODE_STATE NAME=_park
    G90
    G1 Z{z_safe} F{Sz}
    # Keep X before Y. The Blobifier tray is directly behind the cutter pin, so
    # moving sideways first is what lets this park safely from the tray.
    G1 X{Px} F{St}
    G1 Y{Py} F{St}
    RESTORE_GCODE_STATE NAME=_park