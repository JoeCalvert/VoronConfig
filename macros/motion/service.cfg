[gcode_macro SERVICE_POSITION]
description: Move the toolhead front and centre, lifted, with the lights up, to work on the nozzle. Safe during a pause: it only ever raises Z
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set Sx, Sy = v.service_position_xy|map('float') %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}

    _CG28
    {% set z = [[printer.toolhead.position.z|float, v.service_min_z|float]|max, max_z]|min %}
    SAVE_GCODE_STATE NAME=_service
    G90
    G1 Z{z} F{v.z_drop_speed * 60}
    # X before Y, as in PARK: from the Blobifier tray this clears the cutter pin.
    G1 X{Sx} F{v.travel_speed * 60}
    G1 Y{Sy} F{v.travel_speed * 60}
    RESTORE_GCODE_STATE NAME=_service
    LIGHT_ON S=1.0
