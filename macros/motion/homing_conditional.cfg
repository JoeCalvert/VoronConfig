[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {% set previous = printer["gcode_macro _SET_STATE"].state %}
        _SET_STATE STATE=homing
        G28 METHOD=proximity CALIBRATE=0
        _SET_STATE STATE={previous}
    {% endif %}
