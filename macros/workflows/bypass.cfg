# BYPASS: print with filament fed through the ERCF's bypass instead of a gate.
#
#   1. Select bypass (unloads whatever is loaded first).
#   2. Feed the filament through the bypass to the extruder, then Load.
#   3. In PrusaSlicer pick the "(bypass)" twin of your nozzle's printer and
#      print as usual. Happy Hare sees the bypass is loaded and skips loading
#      a gate; PREFLIGHT_CHECK skips the gate checks.
# The bypass position is calibrated in RETUNE -> Selector and servo.

[gcode_macro BYPASS]
description: Print through the ERCF bypass: select it, load, unload
gcode:
    {% set mmu = printer.mmu %}
    {% set selected = mmu.tool == -2 %}
    {% set loaded = mmu.filament_pos|int != 0 %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("BYPASS: not during a print") }
    {% endif %}
    _DIALOG TITLE="Bypass"
    {% if not selected %}
        _DIALOG_TEXT MSG="Select the bypass{', which unloads the filament first' if loaded else ''}. Then feed filament through it to the extruder and Load."
        _DIALOG_BUTTON LABEL="Select bypass" ACTION=_BYPASS_SELECT STYLE=primary
    {% elif not loaded %}
        _DIALOG_TEXT MSG="Bypass selected. Feed the filament through the bypass until the extruder gears grip it, then Load."
        _DIALOG_BUTTON LABEL="Load to the nozzle" ACTION=_BYPASS_LOAD STYLE=primary
    {% else %}
        _DIALOG_TEXT MSG="Bypass loaded. In PrusaSlicer, pick the (bypass) printer for your nozzle and print as usual."
        _DIALOG_BUTTON LABEL="Unload" ACTION=_BYPASS_UNLOAD
    {% endif %}
    _DIALOG_BUTTON LABEL="Back" ACTION=MENU FOOTER=1
    _DIALOG_SHOW

[gcode_macro _BYPASS_SELECT]
description: Bypass step: unload if needed, select the bypass
gcode:
    _DIALOG_CLOSE
    {% if printer.mmu.filament_pos|int != 0 %}
        MMU_UNLOAD
    {% endif %}
    MMU_SELECT_BYPASS
    BYPASS

[gcode_macro _BYPASS_LOAD]
description: Bypass step: load the extruder from the bypass
gcode:
    _DIALOG_CLOSE
    MMU_LOAD
    BYPASS

[gcode_macro _BYPASS_UNLOAD]
description: Bypass step: unload the extruder
gcode:
    _DIALOG_CLOSE
    MMU_UNLOAD
    BYPASS
