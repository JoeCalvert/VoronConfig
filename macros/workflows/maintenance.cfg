# MAINTENANCE: printing-hour counters for routine jobs (carbon filter, rail
# lubrication and belts, nozzle wear), from maintenance_items in
# config/variables.cfg. Hours are kept in save_variables, so they survive
# restarts.
#
# _END_JOB adds each job's printing time (print_stats.print_duration, so
# pauses don't count). The filter only counts jobs with a chamber
# temperature. When a counter passes its interval you get a notification,
# and MENU shows "Maintenance due".

[gcode_macro MAINTENANCE]
description: Show the maintenance counters, and mark jobs done
gcode:
    {% set items = printer["gcode_macro _USER_VARIABLES"].maintenance_items %}
    {% set hours = printer.save_variables.variables.maintenance_hours|default({}) %}
    _DIALOG TITLE="Maintenance"
    {% for key, item in items.items() %}
        {% set what, every = item %}
        {% set h = hours[key]|default(0)|float %}
        _DIALOG_TEXT MSG="{what}: {'%.1f' % h} of {every} h{' - DUE' if h >= every else ''}"
    {% endfor %}
    _DIALOG_TEXT MSG="Mark a job done to restart its count:"
    {% for key, item in items.items() %}
        {% set h = hours[key]|default(0)|float %}
        _DIALOG_BUTTON LABEL="Done: {item[0]}" ACTION="_MAINTENANCE_RESET ITEM={key}" STYLE={'warning' if h >= item[1] else 'secondary'}
    {% endfor %}
    _DIALOG_BUTTON LABEL="Back" ACTION=MENU FOOTER=1
    _DIALOG_SHOW

[gcode_macro _MAINTENANCE_RESET]
description: Restart one maintenance counter. ITEM=<key>
gcode:
    {% set items = printer["gcode_macro _USER_VARIABLES"].maintenance_items %}
    {% set item = params.ITEM|default('')|lower %}
    {% if item not in items %}
        { action_raise_error("_MAINTENANCE_RESET: unknown ITEM '%s' (one of %s)" % (item, items.keys()|list|join(', '))) }
    {% endif %}
    {% set new = {} %}
    {% for k, v in (printer.save_variables.variables.maintenance_hours|default({})).items() %}
        {% set _ = new.update({k: v}) %}
    {% endfor %}
    {% set _ = new.update({item: 0.0}) %}
    SAVE_VARIABLE VARIABLE=maintenance_hours VALUE="{new}"
    {% if params.QUIET is not defined %}
        MAINTENANCE
    {% endif %}

[gcode_macro _MAINTENANCE_ADD]
description: Add the finished job's printing time to the counters. FILTER=1 if the filter ran
gcode:
    {% set items = printer["gcode_macro _USER_VARIABLES"].maintenance_items %}
    {% set old = printer.save_variables.variables.maintenance_hours|default({}) %}
    {% set add = printer.print_stats.print_duration|default(0)|float / 3600 %}
    {% set new = {} %}
    {% set due = [] %}
    {% for key, item in items.items() %}
        {% set before = old[key]|default(0)|float %}
        {% set after = before + (add if key != 'filter' or params.FILTER|default(0)|int else 0) %}
        {% set _ = new.update({key: (after * 100)|round / 100}) %}
        {% if before < item[1] <= after %}
            {% set _ = due.append(item[0]) %}
        {% endif %}
    {% endfor %}
    {% if add > 0 %}
        SAVE_VARIABLE VARIABLE=maintenance_hours VALUE="{new}"
    {% endif %}
    {% if due %}
        _NOTIFY MSG="Maintenance due: {due|join(', ')}"
    {% endif %}
