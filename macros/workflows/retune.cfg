# RETUNE: every tune in one menu (MENU -> Calibrate -> Retune).
#
# Pick any tune. For a full retune, go top to bottom: each one assumes the
# ones above it (mechanics and belts before anything that measures motion,
# the ERCF before filament tests, PA before EM). Each tune has its own dialog:
# what to do, the target values, and buttons that run the work. "Mark done"
# ticks it off; ticks are kept in save_variables (retune_done), so they
# survive restarts, and the first unticked tune is highlighted. The full
# guide, with the reasoning and sources, is docs/retune.md.

[gcode_macro RETUNE]
description: Tune menu: motion, heaters, ERCF and Filamentalist, first layer, PA/EM. Pick any, or go top to bottom
# [key, group, title, macro]
variable_steps: [
    ['mech',       'Motion',  'Mechanical check',              '_RETUNE_MECH'],
    ['belts',      'Motion',  'Belts (Z, then A/B)',           '_RETUNE_BELTS'],
    ['edges',      'Motion',  'Mesh and QGL edges',            '_RETUNE_EDGES'],
    ['shaper',     'Motion',  'Input shaper and acceleration', '_RETUNE_SHAPER'],
    ['pid',        'Heaters', 'PID (nozzle and bed)',          '_RETUNE_PID'],
    ['selector',   'ERCF',    'Selector and servo',            '_RETUNE_SELECTOR'],
    ['gear',       'ERCF',    'Gear, encoder and bowden',      '_RETUNE_GEAR'],
    ['rewinder',   'ERCF',    'Filamentalist tension',         '_RETUNE_REWINDER'],
    ['gates',      'ERCF',    'Per-gate calibration',          '_RETUNE_GATES'],
    ['toolhead',   'ERCF',    'Toolhead distances',            '_RETUNE_TOOLHEAD'],
    ['soak',       'ERCF',    'Load/unload soak test',         '_RETUNE_SOAK'],
    ['extruder',   'Print',   'Extruder check (optional)',     '_RETUNE_EXTRUDER'],
    ['firstlayer', 'Print',   'First layer',                   '_RETUNE_FIRSTLAYER'],
    ['filament',   'Print',   'PA and EM per filament',        '_RETUNE_FILAMENT'],
  ]
gcode:
    {% set done = printer.save_variables.variables.retune_done|default([]) %}
    {% set steps = printer['gcode_macro RETUNE'].steps %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("RETUNE: not during a print") }
    {% endif %}
    {% set ticked = [] %}
    {% for st in steps %}{% if st[0] in done %}{% set _ = ticked.append(st[0]) %}{% endif %}{% endfor %}
    _DIALOG TITLE="Retune"
    _DIALOG_TEXT MSG="Pick any tune. For a full retune go top to bottom. {ticked|length} of {steps|length} ticked. Guide: docs/retune.md"
    {% set ns = namespace(next=True, group='') %}
    {% for key, group, title, macro in steps %}
        {% if group != ns.group %}
            {% set ns.group = group %}
            _DIALOG_TEXT MSG="{group}"
        {% endif %}
        {% set is_done = key in done %}
        {% set style = 'secondary' if is_done else ('primary' if ns.next else '') %}
        {% if not is_done %}{% set ns.next = False %}{% endif %}
        _DIALOG_BUTTON LABEL="{'Done - ' if is_done else ''}{title}" ACTION={macro}{(' STYLE=' ~ style) if style else ''}
    {% endfor %}
    _DIALOG_BUTTON LABEL="Clear ticks" ACTION=_RETUNE_RESET FOOTER=1 STYLE=warning
    _DIALOG_BUTTON LABEL="Back" ACTION=CALIBRATE FOOTER=1
    _DIALOG_SHOW

[gcode_macro _RETUNE_MARK]
description: Mark a retune step done or not done. STEP=<key> DONE=0|1
gcode:
    {% set done = printer.save_variables.variables.retune_done|default([])|list %}
    {% set key = params.STEP|lower %}
    {% set new = done|reject('equalto', key)|list %}
    {% if params.DONE|default(1)|int %}
        {% set _ = new.append(key) %}
    {% endif %}
    SAVE_VARIABLE VARIABLE=retune_done VALUE="{new}"
    RETUNE

[gcode_macro _RETUNE_RESET]
description: Clear the retune checklist (asks first)
gcode:
    {% if params.SURE|default(0)|int %}
        SAVE_VARIABLE VARIABLE=retune_done VALUE="[]"
        RETUNE
    {% else %}
        _DIALOG TITLE="Clear all ticks?"
        _DIALOG_TEXT MSG="This only clears the ticks. Nothing on the printer changes."
        _DIALOG_BUTTON LABEL="Yes, clear" ACTION="_RETUNE_RESET SURE=1" FOOTER=1 STYLE=warning
        _DIALOG_BUTTON LABEL="No" ACTION=RETUNE FOOTER=1
        _DIALOG_SHOW
    {% endif %}

[gcode_macro _RETUNE_FOOTER]
description: Footer buttons for a retune step dialog. STEP=<key> SELF=<this step's macro>
gcode:
    {% set done = params.STEP in printer.save_variables.variables.retune_done|default([]) %}
    {% if done %}
        _DIALOG_BUTTON LABEL="Mark not done" ACTION="_RETUNE_MARK STEP={params.STEP} DONE=0" FOOTER=1
    {% else %}
        _DIALOG_BUTTON LABEL="Mark done" ACTION="_RETUNE_MARK STEP={params.STEP} DONE=1" FOOTER=1 STYLE=primary
    {% endif %}
    _DIALOG_BUTTON LABEL="Back" ACTION=RETUNE FOOTER=1
    _DIALOG_SHOW

# --- Mechanical check ------------------------------------------------------
[gcode_macro _RETUNE_MECH]
description: Retune step: mechanical check
gcode:
    _DIALOG TITLE="Mechanical check"
    _DIALOG_TEXT MSG="Toolhead: every screw snug (cowl, hotend, extruder, Beacon mount, carriage). A cowl screw that has pulled through needs a washer or a reprinted part. Part fan seated. Tap the toolhead: nothing should rattle."
    _DIALOG_TEXT MSG="Gantry: XY joint and idler screws tight, nothing loose on the umbilical or bowden."
    _DIALOG_TEXT MSG="BFI: both screws on each tensioner turned the same amount, idler square, belt running centred on it. Lock the screws (threadlocker or nyloc), people report them backing off."
    _DIALOG_BUTTON LABEL="Service position (front, lifted)" ACTION=_RETUNE_SERVICE
    _RETUNE_FOOTER STEP=mech

[gcode_macro _RETUNE_SERVICE]
description: Service position, then back to the mechanical-check step
gcode:
    _DIALOG_CLOSE
    SERVICE_POSITION
    _RETUNE_MECH

# --- Belts -----------------------------------------------------------------
[gcode_macro _RETUNE_BELTS]
description: Retune step: belt tension with the meter, then the belt comparison
gcode:
    _DIALOG TITLE="Belts"
    _DIALOG_TEXT MSG="Meter first: it should read 1.9 on its music-wire jig (adjust the preload screw)."
    _DIALOG_TEXT MSG="Z belts: 2.5 to 2.8 on the meter (EPDM belts 2.6 to 2.9), all four the same."
    _DIALOG_TEXT MSG="A/B: printer cold, motors on, toolhead centred. 1.8 to 2.2 (EPDM 1.9 to 2.3). Read three times. A and B affect each other: go back and forth until equal."
    _DIALOG_TEXT MSG="Then home, re-check, and run the belt comparison. Adjust and repeat until 90 percent or more similar."
    _DIALOG_BUTTON LABEL="Move to the belt-check position" ACTION=_RETUNE_BELT_POSITION
    _DIALOG_BUTTON LABEL="Belt comparison (Shake&Tune)" ACTION="_CAL_BELTS BACK=_RETUNE_BELTS"
    _RETUNE_FOOTER STEP=belts

[gcode_macro _RETUNE_BELT_POSITION]
description: Home if needed and move to the belt-check position; motors stay on
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set bx, by = v.belt_check_position_xy|map('float') %}
    _DIALOG_CLOSE
    _CG28
    G90
    G1 Z{[printer.toolhead.position.z, 50]|max} F{v.z_drop_speed * 60}
    G1 X{bx} Y{by} F{v.travel_speed * 60}
    _RETUNE_BELTS

# --- Mesh and QGL edges ----------------------------------------------------
[gcode_macro _RETUNE_EDGES]
description: Retune step: check Beacon reaches the plate at the mesh and QGL limits
gcode:
    _DIALOG TITLE="Mesh and QGL edges"
    _DIALOG_TEXT MSG="Run QGL and watch each of the four probe points: Beacon must be fully over the plate, clear of edges and clips."
    _DIALOG_TEXT MSG="Then a full mesh: in Fluidd's mesh view, no sudden drop or jump along any edge. If there is, move that mesh_min/mesh_max in by 5 to 10 mm (config/software/bed_mesh.cfg)."
    _DIALOG_BUTTON LABEL="Run QGL" ACTION=_RETUNE_QGL
    _DIALOG_BUTTON LABEL="Full bed mesh" ACTION="_CAL_MESH BACK=_RETUNE_EDGES"
    _RETUNE_FOOTER STEP=edges

[gcode_macro _RETUNE_QGL]
description: Home if needed, run a full QGL, then back to the edges step
gcode:
    _DIALOG_CLOSE
    _CG28
    QUAD_GANTRY_LEVEL
    _RETUNE_EDGES

# --- Input shaper ----------------------------------------------------------
[gcode_macro _RETUNE_SHAPER]
description: Retune step: input shaper and acceleration limit
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    _DIALOG TITLE="Input shaper"
    _DIALOG_TEXT MSG="After the belts. Measure with the printer as it prints: bed at temperature (heat changes belt tension)."
    _DIALOG_TEXT MSG="a) Axes map, once: checks Beacon's accelerometer orientation. b) Shaper graphs: should show one clean peak per axis. c) Measure and apply: Klipper picks the shapers, they're active at once, Save keeps them."
    _DIALOG_TEXT MSG="Then set max_accel (config/machine.cfg) to the lower of the two recommended accelerations in the console, and the damping ratios from the graphs (config/software/input_shaper.cfg)."
    _DIALOG_BUTTON LABEL="Heat the bed ({v.print_default_bed_temp}°C)" ACTION=_RETUNE_HEAT_BED
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="a) Axes map" ACTION="_CAL_AXES_MAP BACK=_RETUNE_SHAPER"
    _DIALOG_BUTTON LABEL="b) Shaper graphs" ACTION="_CAL_SHAPER BACK=_RETUNE_SHAPER"
    _DIALOG_BUTTON LABEL="c) Measure and apply" ACTION="_CAL_SHAPER_KLIPPER BACK=_RETUNE_SHAPER"
    _DIALOG_ROW_END
    _RETUNE_FOOTER STEP=shaper

[gcode_macro _RETUNE_HEAT_BED]
description: Heat the bed to the default print temperature (not waiting), then back to the shaper step
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    M140 S{v.print_default_bed_temp}
    _RETUNE_SHAPER

# --- PID -------------------------------------------------------------------
[gcode_macro _RETUNE_PID]
description: Retune step: PID for nozzle and bed
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    _DIALOG TITLE="PID"
    _DIALOG_TEXT MSG="Each takes a few minutes and shows the result with a Save button (Klipper restarts). Bed first if you like: it takes longest."
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Nozzle ({v.print_default_extruder_temp}°C)" ACTION="_CAL_PID HEATER=extruder TARGET={v.print_default_extruder_temp} BACK=_RETUNE_PID"
    _DIALOG_BUTTON LABEL="Bed ({v.print_default_bed_temp}°C)" ACTION="_CAL_PID HEATER=heater_bed TARGET={v.print_default_bed_temp} BACK=_RETUNE_PID"
    _DIALOG_ROW_END
    _RETUNE_FOOTER STEP=pid

# --- ERCF ---------------------------------------------------------------------
# Happy Hare v4's calibration order: selector, gear, encoder, bowden, per-gate,
# toolhead (redoing the gear means redoing encoder, bowden and per-gate). Status
# comes from Happy Hare's saved calibration (mmu_vars.cfg, unit unit0). Old v3
# values to sanity-check against are in docs/retune.md.

[gcode_macro _RETUNE_SELECTOR]
description: Retune: ERCF selector positions and servo angles
gcode:
    {% set sel = printer.save_variables.variables.mmu_unit0_selector_offsets|default([-1]) %}
    {% set sel_ok = sel|length > 0 and sel|min >= 0 %}
    _DIALOG TITLE="ERCF selector and servo"
    _DIALOG_TEXT MSG="Selector: press Motors off, slide the selector by hand until it lines up with gate 0, then Calibrate. It sweeps the full travel and works out every gate (v3: 3.2, 26.6, 50.0 ... 167.0)."
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Motors off" ACTION=MMU_MOTORS_OFF
    _DIALOG_BUTTON LABEL="{'Done - ' if sel_ok else ''}Calibrate" ACTION="_RETUNE_MMU_DO STEP=selector"
    _DIALOG_BUTTON LABEL="Check: home, gate 7" ACTION="_RETUNE_MMU_DO STEP=selector_check"
    _DIALOG_ROW_END
    {% set bp = printer.save_variables.variables.mmu_unit0_selector_bypass_offset|default(-1) %}
    _DIALOG_TEXT MSG="Bypass (for BYPASS printing): Motors off, slide the selector to line up with the bypass, then Calibrate bypass (v3: 180.7)."
    _DIALOG_BUTTON LABEL="{'Done - ' if bp|float > 0 else ''}Calibrate bypass" ACTION="_RETUNE_MMU_DO STEP=selector_bypass"
    _DIALOG_TEXT MSG="Servo: try each position. Up must let the filament slide freely, down must grip it, move must clear everything while the selector travels (v3: down 75, up 155, move 132)."
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Up" ACTION="_RETUNE_MMU_DO STEP=servo_up"
    _DIALOG_BUTTON LABEL="Down" ACTION="_RETUNE_MMU_DO STEP=servo_down"
    _DIALOG_BUTTON LABEL="Move" ACTION="_RETUNE_MMU_DO STEP=servo_move"
    _DIALOG_ROW_END
    _DIALOG_TEXT MSG="To adjust one, in the console: MMU_SERVO ANGLE=(angle) until it's right, then MMU_SERVO POS=(up, down or move) SAVE=1."
    _RETUNE_FOOTER STEP=selector

[gcode_macro _RETUNE_GEAR]
description: Retune: ERCF gear rotation distance, encoder resolution and bowden length (gate 0)
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set rd = sv.mmu_unit0_gear_rotation_distances|default([-1]) %}
    {% set enc = sv.mmu_unit0_encoder_resolution|default(-1) %}
    {% set bow = sv.mmu_unit0_bowden_lengths|default([-1]) %}
    _DIALOG TITLE="ERCF gear, encoder and bowden"
    _DIALOG_TEXT MSG="All on gate 0, in this order. Redoing the gear means redoing the rest, and Per-gate calibration."
    _DIALOG_TEXT MSG="Gear: filament in gate 0. Advance, cut it flush where it leaves the ERCF, Move 100 mm, measure what came out, then type in the console: MMU_CALIBRATE_GEAR MEASURED=(that distance). Move 100 mm again to check. (v3: 23.60)"
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Advance 50 mm" ACTION="_RETUNE_MMU_DO STEP=gear_advance"
    _DIALOG_BUTTON LABEL="{'Done - ' if rd[0] > 0 else ''}Move 100 mm" ACTION="_RETUNE_MMU_DO STEP=gear_move"
    _DIALOG_ROW_END
    _DIALOG_TEXT MSG="Encoder and bowden are automatic and need the gate 0 filament past the encoder, where the gear step leaves it. (v3: encoder 0.9535, bowden 1198.9 mm)"
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="{'Done - ' if enc|float > 0 else ''}Encoder" ACTION="_RETUNE_MMU_DO STEP=encoder"
    _DIALOG_BUTTON LABEL="{'Done - ' if bow[0] > 0 else ''}Bowden length" ACTION="_RETUNE_MMU_DO STEP=bowden"
    _DIALOG_ROW_END
    _RETUNE_FOOTER STEP=gear

[gcode_macro _RETUNE_REWINDER]
description: Retune: Filamentalist rewinder tension, with a per-gate out-and-back test
gcode:
    {% set mmu = printer.mmu %}
    _DIALOG TITLE="Filamentalist tension"
    _DIALOG_TEXT MSG="As light as will still rewind. With no filament loaded, turn the tension screw until it just touches the top washer (the Filamentalist designers' advice on the Armchair Discord)."
    _DIALOG_TEXT MSG="Then test each gate: it pushes the filament 300 mm into the bowden and pulls it back. Watch the spool: it must take the slack up with no loose loop. In the console both moves should read close to 300 measured (a big shortfall is the gear slipping: too tight, or a dragging spool)."
    {% for g in range(mmu.num_gates) %}
        {% if g % 4 == 0 %}_DIALOG_ROW{% endif %}
        _DIALOG_BUTTON LABEL="Gate {g}" ACTION="_RETUNE_MMU_DO STEP=rewind GATE={g}"{' STYLE=secondary' if mmu.gate_status[g] == 0 else ''}
        {% if g % 4 == 3 or g == mmu.num_gates - 1 %}_DIALOG_ROW_END{% endif %}
    {% endfor %}
    _RETUNE_FOOTER STEP=rewinder

[gcode_macro _RETUNE_GATES]
description: Retune: per-gate rotation distance and a check of every gate
gcode:
    {% set mmu = printer.mmu %}
    {% set rd = printer.save_variables.variables.mmu_unit0_gear_rotation_distances|default([-1]) %}
    _DIALOG TITLE="ERCF per-gate calibration"
    _DIALOG_TEXT MSG="After gear and encoder, with filament in every gate. Each gate's gear runs slightly differently (its BMG gear mesh, the spool's drag), so Happy Hare measures each one against the encoder."
    {% if rd|length > 1 and rd[0] > 0 %}
        {% set parts = [] %}
        {% for r in rd %}
            {% if r > 0 %}
                {% set pct = (r / rd[0] - 1) * 100 %}
                {% set _ = parts.append('%d: %.2f (%+.1f%%)%s' % (loop.index0, r, pct, ' check' if pct|abs > 2 else '')) %}
            {% else %}
                {% set _ = parts.append('%d: not done' % loop.index0) %}
            {% endif %}
        {% endfor %}
        _DIALOG_TEXT MSG="Now: {parts|join(', ')}. More than 2 percent from gate 0 usually means a misaligned BMG gear, a tight Filamentalist or a dragging spool."
    {% endif %}
    _DIALOG_BUTTON LABEL="Calibrate all gates" ACTION="_RETUNE_MMU_DO STEP=gates" STYLE=primary
    _DIALOG_BUTTON LABEL="Check all gates (parks each, marks it available)" ACTION="_RETUNE_MMU_DO STEP=check_gates"
    _RETUNE_FOOTER STEP=gates

[gcode_macro _RETUNE_TOOLHEAD]
description: Retune: toolhead sensor-to-nozzle distances and the cutter
gcode:
    _DIALOG TITLE="Toolhead distances"
    _DIALOG_TEXT MSG="Measures the toolhead sensor, extruder and nozzle distances with the toolhead sensor. After a cold pull (clean nozzle) run Clean, then load filament and run Dirty, then Cut. Each needs the nozzle hot enough for the filament."
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Clean" ACTION="_RETUNE_MMU_DO STEP=toolhead_clean"
    _DIALOG_BUTTON LABEL="Dirty" ACTION="_RETUNE_MMU_DO STEP=toolhead_dirty"
    _DIALOG_BUTTON LABEL="Cut" ACTION="_RETUNE_MMU_DO STEP=toolhead_cut"
    _DIALOG_ROW_END
    _RETUNE_FOOTER STEP=toolhead

[gcode_macro _RETUNE_SOAK]
description: Retune: load/unload soak test across all gates
gcode:
    _DIALOG TITLE="Load/unload soak test"
    _DIALOG_TEXT MSG="Proves the calibration: loads and unloads every gate in turn. Filament in every gate. Quick goes partway down the bowden, Full goes to the extruder each time (slow). Any failure pauses with the usual MMU recovery."
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Quick, 3 rounds" ACTION="_RETUNE_MMU_DO STEP=soak_quick"
    _DIALOG_BUTTON LABEL="Full, 1 round" ACTION="_RETUNE_MMU_DO STEP=soak_full"
    _DIALOG_ROW_END
    _RETUNE_FOOTER STEP=soak

[gcode_macro _RETUNE_MMU_DO]
description: Run one ERCF calibration or test, then show its retune dialog again. STEP=<name> [GATE=n]
gcode:
    {% set step = params.STEP|default('')|lower %}
    {% set mmu = printer.mmu %}
    _DIALOG_CLOSE
    {% if step == 'selector' %}
        MMU_CALIBRATE_SELECTOR AUTO=1
    {% elif step == 'selector_bypass' %}
        MMU_CALIBRATE_SELECTOR BYPASS=1
    {% elif step == 'selector_check' %}
        MMU_HOME
        MMU_SELECT GATE={mmu.num_gates - 1}
    {% elif step in ['servo_up', 'servo_down', 'servo_move'] %}
        MMU_SERVO POS={step[6:]}
    {% elif step == 'gear_advance' %}
        MMU_SELECT GATE=0
        MMU_TEST_MOVE MOVE=50
    {% elif step == 'gear_move' %}
        MMU_TEST_MOVE MOVE=100 GRIP=1
    {% elif step == 'encoder' %}
        MMU_SELECT GATE=0
        MMU_CALIBRATE_ENCODER
    {% elif step == 'bowden' %}
        MMU_SELECT GATE=0
        MMU_CALIBRATE_BOWDEN
    {% elif step == 'rewind' %}
        {% set g = params.GATE|int %}
        {% if mmu.filament_pos != 0 %}
            { action_raise_error("Unload the filament first (MMU panel): the test starts with every gate parked") }
        {% endif %}
        {% if mmu.gate_status[g] == 0 %}
            { action_raise_error("Gate %d is empty" % g) }
        {% endif %}
        MMU_SELECT GATE={g}
        MMU_TEST_MOVE MOVE=300
        MMU_TEST_MOVE MOVE=-300
        MMU_CHECK_GATE GATE={g}
    {% elif step == 'gates' %}
        MMU_CALIBRATE_GATE ALL=1
    {% elif step == 'check_gates' %}
        MMU_CHECK_GATE ALL=1
    {% elif step == 'toolhead_clean' %}
        MMU_CALIBRATE_TOOLHEAD CLEAN=1
    {% elif step == 'toolhead_dirty' %}
        MMU_CALIBRATE_TOOLHEAD DIRTY=1
    {% elif step == 'toolhead_cut' %}
        MMU_CALIBRATE_TOOLHEAD CUT=1
    {% elif step == 'soak_quick' %}
        MMU_SOAKTEST_LOAD_SEQUENCE LOOP=3 FULL=0
    {% elif step == 'soak_full' %}
        MMU_SOAKTEST_LOAD_SEQUENCE LOOP=1 FULL=1
    {% else %}
        { action_raise_error("_RETUNE_MMU_DO: unknown STEP '%s'" % step) }
    {% endif %}
    {% set back = {'selector': '_RETUNE_SELECTOR', 'selector_bypass': '_RETUNE_SELECTOR', 'selector_check': '_RETUNE_SELECTOR', 'servo_up': '_RETUNE_SELECTOR',
                   'servo_down': '_RETUNE_SELECTOR', 'servo_move': '_RETUNE_SELECTOR', 'gear_advance': '_RETUNE_GEAR',
                   'gear_move': '_RETUNE_GEAR', 'encoder': '_RETUNE_GEAR', 'bowden': '_RETUNE_GEAR',
                   'rewind': '_RETUNE_REWINDER', 'gates': '_RETUNE_GATES', 'check_gates': '_RETUNE_GATES',
                   'toolhead_clean': '_RETUNE_TOOLHEAD', 'toolhead_dirty': '_RETUNE_TOOLHEAD', 'toolhead_cut': '_RETUNE_TOOLHEAD',
                   'soak_quick': '_RETUNE_SOAK', 'soak_full': '_RETUNE_SOAK'} %}
    {back[step]}

# --- Extruder rotation distance (optional) ----------------------------------
[gcode_macro _RETUNE_EXTRUDER]
description: Retune step: check the extruder's rotation distance
gcode:
    _DIALOG TITLE="Extruder check (optional)"
    _DIALOG_TEXT MSG="The Galileo 2 is already calibrated (rotation_distance 47.32). To check: filament loaded, mark it 120 mm above the extruder entry, press the button (heats, then extrudes 100 mm slowly), measure what's left above the entry."
    _DIALOG_TEXT MSG="Should be 20 mm left. If not: new = 47.32344 x (100 / actual extruded), in config/hardware/extruder.cfg."
    _DIALOG_BUTTON LABEL="Heat and extrude 100 mm slowly" ACTION=_RETUNE_EXTRUDE
    _RETUNE_FOOTER STEP=extruder

[gcode_macro _RETUNE_EXTRUDE]
description: Heat the nozzle and extrude 100 mm at 1 mm/s, then nozzle off
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set mmu = printer.mmu|default(None) %}
    {% if mmu and mmu.enabled and mmu.filament_pos|int != 10 %}
        { action_raise_error("Load the filament to the nozzle first (MMU panel)") }
    {% endif %}
    _DIALOG_CLOSE
    M109 S{v.print_default_extruder_temp}
    M83
    G1 E100 F60
    M104 S0
    _RETUNE_EXTRUDER

# --- First layer -----------------------------------------------------------
[gcode_macro _RETUNE_FIRSTLAYER]
description: Retune step: first layer height
gcode:
    {% set off = printer['gcode_macro _BEACON_VARS'].hot_nozzle_offset %}
    _DIALOG TITLE="First layer"
    _DIALOG_TEXT MSG="Print a one-layer test (Ellis's first-layer squares) the normal way. Beacon's contact homing sets Z each print, then START_PRINT raises Z by hot_nozzle_offset ({off} mm) for the hot nozzle."
    _DIALOG_TEXT MSG="If the layer is too squashed or too loose, baby-step Z during the test, note the total change, and add it to hot_nozzle_offset in config/hardware/probe.cfg (positive = nozzle higher)."
    _RETUNE_FOOTER STEP=firstlayer

# --- PA and EM -------------------------------------------------------------
[gcode_macro _RETUNE_FILAMENT]
description: Retune: pressure advance and extrusion multiplier per filament (generated test prints)
gcode:
    {% set tuning = printer.save_variables.variables.filament_tuning|default({}) %}
    _DIALOG TITLE="PA and EM per filament"
    _DIALOG_TEXT MSG="Ellis's methods, printed for this printer: pick a gate and a range, and the printer makes the test and prints it like any job (loads the gate, contact Z, adaptive mesh). When it ends, pick the best pattern: it's applied and kept here."
    _DIALOG_TEXT MSG="Pressure advance first (per nozzle), then extrusion multiplier (it uses that PA). Max flow once per filament, on the HF nozzle. Results go to the filament in Spoolman. Rebuild the PrusaSlicer presets afterwards (docs/slicer.md)."
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Pressure advance" ACTION="CAL_FILAMENT TEST=pa" STYLE=primary
    _DIALOG_BUTTON LABEL="Extrusion multiplier" ACTION="CAL_FILAMENT TEST=em"
    _DIALOG_BUTTON LABEL="Max flow" ACTION="CAL_FILAMENT TEST=flow"
    _DIALOG_ROW_END
    {% if printer.save_variables.variables.cal_last is defined %}
        _DIALOG_BUTTON LABEL="Pick the result of the last test again" ACTION=_CAL_FILAMENT_RESULT
    {% endif %}
    {% if tuning %}
        _DIALOG_TEXT MSG="Results so far (filament, nozzle):"
        {% for key in tuning|sort %}
            {% set t = tuning[key] %}
            _DIALOG_TEXT MSG="{key|replace('%c' % 35, '')|replace(';', '')|replace('*', '')|replace('"', '')|replace('|', '')}: PA {('%.4f' % t.pa) if t.pa is defined else '-'}, EM {('%.2f' % t.em) if t.em is defined else '-'}, flow {('%.1f' % t.flow) if t.flow is defined else '-'}"
        {% endfor %}
    {% endif %}
    _RETUNE_FOOTER STEP=filament
