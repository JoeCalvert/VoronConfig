# PAUSE_FOR_USER: a planned pause that says why, with Resume / Cancel.
#
# Set PrusaSlicer's Printer Settings -> Custom G-code -> "Pause Print G-code"
# to PAUSE_FOR_USER (docs/slicer.md). PrusaSlicer writes the message you type
# when adding a pause as an M117 line just before it, so the dialog shows it.
# MENU's "Pause at the next layer" uses it too.

[gcode_macro PAUSE_FOR_USER]
description: Pause with a dialog showing why. Usage: PAUSE_FOR_USER [MSG=<text>] (default: the last M117 message)
variable_msg: ''
gcode:
    {% set msg = (params.MSG|default(printer.display_status.message|default('')))|string %}
    {% set msg = msg|replace('%c' % 35, '')|replace(';', ',')|replace('*', '')|replace('"', '')|replace("'", '')|replace('|', '/') or 'Planned pause.' %}
    SET_GCODE_VARIABLE MACRO=PAUSE_FOR_USER VARIABLE=msg VALUE="'{msg}'"
    PAUSE
    _PAUSE_FOR_USER_SHOW
    _NOTIFY MSG="Paused: {msg}"

[gcode_macro _PAUSE_FOR_USER_SHOW]
description: The planned-pause dialog
gcode:
    _DIALOG TITLE="Paused"
    _DIALOG_TEXT MSG="{printer['gcode_macro PAUSE_FOR_USER'].msg}"
    _DIALOG_BUTTON LABEL="Resume" ACTION=_PAUSE_FOR_USER_RESUME STYLE=primary FOOTER=1
    _DIALOG_BUTTON LABEL="Service position" ACTION=_PAUSE_FOR_USER_SERVICE FOOTER=1
    _DIALOG_BUTTON LABEL="Cancel print" ACTION="_CONFIRM_CANCEL BACK=_PAUSE_FOR_USER_SHOW" FOOTER=1 STYLE=error
    _DIALOG_SHOW

[gcode_macro _PAUSE_FOR_USER_SERVICE]
description: Service position, then back to the pause dialog
gcode:
    SERVICE_POSITION
    _PAUSE_FOR_USER_SHOW

[gcode_macro _PAUSE_FOR_USER_RESUME]
description: Resume from a planned pause
gcode:
    _DIALOG_CLOSE
    RESUME

[gcode_macro _PAUSE_NEXT_LAYER]
description: Pause (with the dialog) when the next layer starts
gcode:
    _DIALOG_CLOSE
    SET_PAUSE_NEXT_LAYER ENABLE=1 MACRO=_PAUSE_LAYER_REACHED
    RESPOND MSG="Pausing at the next layer"

[gcode_macro _PAUSE_LAYER_REACHED]
description: The pause asked for with MENU's "Pause at the next layer"
gcode:
    PAUSE_FOR_USER MSG="Paused at the start of the layer, as asked."
