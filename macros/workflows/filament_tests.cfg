# Pressure advance, extrusion multiplier and max flow test prints, generated
# on the printer (tools/calib_gcode.py) for the filament in a chosen gate.
#
#   CAL_FILAMENT TEST=pa|em|flow   pick a gate, then a range, then it prints
#
# The file is a normal print: START_PRINT (with the nozzle check, contact Z
# and adaptive mesh), Happy Hare loads the gate's tool, and MMU_END +
# END_PRINT finish it, so it can be paused or cancelled like any print. When it
# finishes, a dialog asks which pattern is best, applies it, keeps it per
# filament and nozzle (save_variables filament_tuning) and saves it to the
# gate's filament in Spoolman (tools/spoolman_tuning.py), which is where
# tools/build_slicer_profiles.py takes the PrusaSlicer filament values from.
#
# Speed, acceleration, flow limit and fan come from config/variables.cfg
# (calib_*). Set them to what your PrusaSlicer profile uses for perimeters.

[gcode_shell_command calib_gcode]
command: python3 /home/pi/printer_data/config/tools/calib_gcode.py
timeout: 30.0
verbose: True

[gcode_macro CAL_FILAMENT]
description: Print a pressure advance, extrusion multiplier or max flow test for a gate's filament. TEST=pa|em|flow [GATE=n] [RANGE=wide|fine|around]
gcode:
    {% set test = params.TEST|default('pa')|lower %}
    {% set mmu = printer.mmu %}
    {% set back = '_RETUNE_FILAMENT' %}
    {% if test not in ['pa', 'em', 'flow'] %}
        { action_raise_error("CAL_FILAMENT: TEST must be pa, em or flow") }
    {% endif %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("CAL_FILAMENT: not during a print") }
    {% endif %}
    {% if printer.save_variables.variables.nozzle_diameter|default(0)|float == 0 %}
        { action_raise_error("CAL_FILAMENT: fitted nozzle unknown. Run NOZZLE_SET DIAMETER=... first") }
    {% endif %}
    {% set what = printer['gcode_macro _CAL_FILAMENT_SETTINGS'].names[test] %}
    {% if params.GATE is not defined %}
        _DIALOG TITLE="{what} test"
        _DIALOG_TEXT MSG="Which filament? The test loads it, like a print."
        {% for g in range(mmu.num_gates) %}
            {% set tools = mmu.ttg_map|select('equalto', g)|list %}
            {% if mmu.gate_status[g] != 0 and tools %}
                {% set name = [mmu.gate_material[g], mmu.gate_filament_name[g]]|select|join(' ') or 'no filament info' %}
                _DIALOG_BUTTON LABEL="{('Gate %d: %s' % (g, name))|replace('%c' % 35, '')|replace(';', '')|replace('*', '')|replace('"', '')|replace('|', '')}" ACTION="CAL_FILAMENT TEST={test} GATE={g}"
            {% endif %}
        {% endfor %}
        _DIALOG_BUTTON LABEL="Back" ACTION={back} FOOTER=1
        _DIALOG_SHOW
    {% else %}
        _CAL_FILAMENT_RUN TEST={test} GATE={params.GATE|int} RANGE={params.RANGE|default('ask')|lower}
    {% endif %}

[gcode_macro _CAL_FILAMENT_SETTINGS]
description: Settings for CAL_FILAMENT (test ranges)
# [start, step, count] per test and range. 'around' is centred on the last result.
variable_ranges: {
    'pa': {'wide': [0.0, 0.004, 21], 'fine': [0.01, 0.0025, 21], 'around': [-0.01, 0.001, 21]},
    'em': {'wide': [0.86, 0.02, 10], 'around': [-0.03, 0.01, 7]},
  }
# Max flow test bands [start mm³/s, step, count], by nozzle key, else by type.
variable_flow_ranges: {'0.25': [2, 0.5, 14], 'brass': [6, 1, 14], 'obxidian': [6, 1, 14], 'hf': [10, 2, 15]}
# Spoolman filament field each result is saved to (tools/spoolman_tuning.py)
variable_fields: {'pa': 'pa_@', 'em': 'extrusion_multiplier', 'flow': 'max_flow'}
variable_names: {'pa': 'Pressure advance', 'em': 'Extrusion multiplier', 'flow': 'Max flow'}
gcode:
    { action_raise_error("_CAL_FILAMENT_SETTINGS holds settings only") }

[gcode_macro _CAL_FILAMENT_RUN]
description: Show the range choice (RANGE=ask), or generate the test file and start it. TEST=pa|em|flow GATE=n RANGE=ask|wide|fine|around
gcode:
    {% set test = params.TEST|lower %}
    {% set g = params.GATE|int %}
    {% set rng = params.RANGE|lower %}
    {% set mmu = printer.mmu %}
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    {% set cs = printer['gcode_macro _CAL_FILAMENT_SETTINGS'] %}
    {% set sv = printer.save_variables.variables %}
    {% set nozzle = sv.nozzle_diameter|float %}
    {% set ntype = sv.nozzle_type|default('brass') %}
    {% set nkey = ('%.2f' % nozzle) ~ printer['gcode_macro _NOZZLE_KEY'].suffix[ntype] %}
    {% set tools = mmu.ttg_map|select('equalto', g)|list %}
    {% if not tools %}
        { action_raise_error("CAL_FILAMENT: no tool maps to gate %d (MMU_TTG_MAP)" % g) }
    {% endif %}
    {% set tool = mmu.ttg_map.index(g) %}
    {% set spool = mmu.gate_spool_id[g]|default(-1)|int %}
    # Filament key and temperatures, the same way for every caller
    {% set mat = mmu.gate_material[g]|default('')|upper %}
    {% set name = mmu.gate_filament_name[g]|default('') %}
    {% set key = ([mat, name]|select|join(' ') or ('gate %d' % g))|replace("'", '')|replace('"', '') ~ ' ' ~ nkey %}
    {% set hotend = (mmu.gate_temperature[g]|default(0)|int) if mmu.gate_temperature is defined else 0 %}
    {% set hotend = hotend if hotend >= 170 else v.print_default_extruder_temp|int %}
    {% set pre = v.preheat_materials[mat]|default([v.print_default_bed_temp, 0]) %}
    {% set fan = v.calib_fan[mat]|default(v.calib_fan['default'])|int %}
    {% set tuning = sv.filament_tuning|default({}) %}
    {% set prev = tuning[key][test]|default(None) if key in tuning else None %}
    {% set prev_pa = tuning[key].pa|default(None) if key in tuning else None %}
    {% set what = cs.names[test] %}
    {% set clean = key|replace('%c' % 35, '')|replace(';', '')|replace('*', '')|replace('"', '')|replace('|', '') %}
    {% if test == 'flow' %}
        {% set fr = cs.flow_ranges[nkey]|default(cs.flow_ranges[ntype]) %}
    {% endif %}

    {% if rng == 'ask' %}
        _DIALOG TITLE="{what} test: gate {g}"
        _DIALOG_TEXT MSG="{clean}, T{tool}. Nozzle {hotend}°C, bed {pre[0]}°C{(', chamber %d°C' % pre[1]) if pre[1] else ''}.{'' if spool > 0 else ' This gate has no Spoolman spool, so the result is kept on the printer only.'}"
        {% if prev is not none %}
            _DIALOG_TEXT MSG="Last result for this filament: {prev}"
        {% endif %}
        {% if test == 'pa' %}
            _DIALOG_TEXT MSG="Perimeters at {v.calib_perimeter_speed} mm/s and {v.calib_perimeter_accel} mm/s² (the calib settings in config/variables.cfg). Two phases (Ellis): Wide to find the area, then Fine around the pick, offered when you pick."
            _DIALOG_BUTTON LABEL="Wide: 0 to 0.08" ACTION="CAL_FILAMENT TEST=pa GATE={g} RANGE=wide" STYLE=primary
            _DIALOG_BUTTON LABEL="Fine: 0.01 to 0.06" ACTION="CAL_FILAMENT TEST=pa GATE={g} RANGE=fine"
        {% elif test == 'em' %}
            _DIALOG_TEXT MSG="Run after pressure advance: the test uses this filament's PA result {('(%.4f)' % prev_pa) if prev_pa is not none else '(none yet, so the printer default)'}. Coarse first, then fine around the pick."
            _DIALOG_BUTTON LABEL="Coarse: 0.86 to 1.04" ACTION="CAL_FILAMENT TEST=em GATE={g} RANGE=wide" STYLE=primary
        {% else %}
            _DIALOG_TEXT MSG="A single wall in 2 mm bands, {fr[0]} to {fr[0] + fr[1] * (fr[2] - 1)} mm³/s. Spoolman keeps one max flow per filament: run this on your highest-flow nozzle (HF), at the temperature you print at."
            _DIALOG_BUTTON LABEL="Print the flow test" ACTION="CAL_FILAMENT TEST=flow GATE={g} RANGE=wide" STYLE=primary
        {% endif %}
        {% if prev is not none and test != 'flow' %}
            _DIALOG_BUTTON LABEL="Fine around {prev}" ACTION="CAL_FILAMENT TEST={test} GATE={g} RANGE=around"
        {% endif %}
        _DIALOG_BUTTON LABEL="Back" ACTION="CAL_FILAMENT TEST={test}" FOOTER=1
        _DIALOG_SHOW
    {% else %}
    {% set r = fr if test == 'flow' else cs.ranges[test][rng]|default(None) %}
    {% if r is none %}
        { action_raise_error("CAL_FILAMENT: no %s range called %s" % (test, rng)) }
    {% endif %}
    {% set start = r[0] %}
    {% if rng == 'around' %}
        {% if prev is none %}
            { action_raise_error("CAL_FILAMENT: no earlier %s result for %s" % (test, key)) }
        {% endif %}
        {% set start = [(prev|float + r[0])|round(4), 0]|max %}
    {% endif %}
    {% set seq = sv.cal_seq|default(0)|int + 1 %}
    {% set fname = '%s_g%d_%d' % (test, g, seq) %}
    {% set outdir = printer.configfile.settings.virtual_sdcard.path ~ '/calibration' %}
    {% set accel_max = printer.configfile.settings.printer.max_accel|int %}
    {% set vmax = printer.configfile.settings.printer.max_velocity|int %}
    {% set pa_arg = (' --pa %.4f' % prev_pa) if test != 'pa' and prev_pa is not none else '' %}

    _DIALOG_CLOSE
    SAVE_VARIABLE VARIABLE=cal_seq VALUE={seq}
    SAVE_VARIABLE VARIABLE=cal_last VALUE="{ {'test': test, 'range': rng, 'gate': g, 'spool': spool, 'nozzle': nkey, 'key': key, 'start': start, 'step': r[1], 'count': r[2], 'restore_pa': printer.extruder.pressure_advance} }"
    RESPOND MSG="Generating the {what} test for {key}..."
    RUN_SHELL_COMMAND CMD=calib_gcode PARAMS="{test} --out {outdir} --name {fname} --tool {tool} --nozzle {nozzle} --nozzle-type {ntype} --hotend {hotend} --bed {pre[0]} --chamber {pre[1]} --start {start} --step {r[1]} --count {r[2]} --speed {v.calib_perimeter_speed} --accel {v.calib_perimeter_accel} --max-flow {v.calib_max_flow} --max-speed {vmax} --fan {fan} --restore-accel {accel_max}{pa_arg}"
    # A fresh file name each time: if generating failed, this fails too instead of printing an old file
    SDCARD_PRINT_FILE FILENAME="calibration/{fname}.gcode"
    {% endif %}

[gcode_macro _CAL_FILAMENT_RESULT]
description: After a PA/EM/flow test print: pick the best pattern, apply it, keep it, and save it to the filament in Spoolman. [PICK=n]
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set cs = printer['gcode_macro _CAL_FILAMENT_SETTINGS'] %}
    {% set last = sv.cal_last|default(None) %}
    {% if last is none %}
        { action_raise_error("CAL_FILAMENT: no test has been printed yet") }
    {% endif %}
    {% set test = last.test %}
    {% set fmt = {'pa': '%.4f', 'em': '%.2f', 'flow': '%.1f'}[test] %}
    {% if params.PICK is not defined %}
        {% if test == 'flow' %}
            _DIALOG TITLE="Where does the wall go rough?"
            _DIALOG_TEXT MSG="{last.key}. Measure from the bed up to where the wall stops being smooth and solid (gaps, a rough or matt band). Pick the last clean band. The result is saved with a 10 percent margin."
        {% else %}
            _DIALOG TITLE="Which {'pattern' if test == 'pa' else 'square'} is best?"
            _DIALOG_TEXT MSG="{last.key}. Numbered on the print from 1 (leftmost{', every 5th' if test == 'pa' else ''})."
            {% if test == 'pa' %}
                _DIALOG_TEXT MSG="Best = sharpest corner, with no gap or bulge where the lines start and end."
            {% else %}
                _DIALOG_TEXT MSG="Best = smooth top surface: no gaps between lines (too low), no ridges or rough patches (too high)."
            {% endif %}
        {% endif %}
        {% for i in range(last.count) %}
            {% if i % 3 == 0 %}_DIALOG_ROW{% endif %}
            {% if test == 'flow' %}
                _DIALOG_BUTTON LABEL="{i + 1} (to ~{'%.0f' % ((i + 1) * 2)} mm): {fmt % (last.start + i * last.step)}" ACTION="_CAL_FILAMENT_RESULT PICK={i + 1}"
            {% else %}
                _DIALOG_BUTTON LABEL="{i + 1}: {fmt % (last.start + i * last.step)}" ACTION="_CAL_FILAMENT_RESULT PICK={i + 1}"
            {% endif %}
            {% if i % 3 == 2 or i == last.count - 1 %}_DIALOG_ROW_END{% endif %}
        {% endfor %}
        _DIALOG_BUTTON LABEL="Close" ACTION=_DIALOG_CLOSE FOOTER=1
        _DIALOG_SHOW
    {% else %}
        {% set i = params.PICK|int - 1 %}
        {% set picked = last.start + i * last.step %}
        {% set value = (fmt % (picked * 0.9 if test == 'flow' else picked))|float %}
        {% set old = sv.filament_tuning|default({}) %}
        {% set tuning = {} %}
        {% for k in old %}{% set _ = tuning.update({k: old[k]}) %}{% endfor %}
        {% set entry = {} %}
        {% for k in old[last.key]|default({}) %}{% set _ = entry.update({k: old[last.key][k]}) %}{% endfor %}
        {% set _ = entry.update({test: value}) %}
        {% set _ = tuning.update({last.key: entry}) %}
        {% set field = cs.fields[test]|replace('@', last.nozzle|default('')|replace('.', '_')) %}
        SAVE_VARIABLE VARIABLE=filament_tuning VALUE="{tuning}"
        {% if test == 'pa' %}
            SET_PRESSURE_ADVANCE ADVANCE={value}
        {% endif %}
        {% if last.spool|default(-1) > 0 %}
            RUN_SHELL_COMMAND CMD=spoolman_tuning PARAMS="set --spool {last.spool} --field {field} --value {value}"
        {% endif %}
        _DIALOG TITLE="{last.key}: {cs.names[test]} {fmt % value}"
        {% if last.spool|default(-1) > 0 %}
            _DIALOG_TEXT MSG="Saved to the filament in Spoolman ({field}). Rebuild the PrusaSlicer presets to use it in prints (docs/slicer.md)."
        {% else %}
            _DIALOG_TEXT MSG="The gate has no Spoolman spool, so this is kept on the printer only. Assign the spool and pick again to save it."
        {% endif %}
        {% if test == 'pa' %}
            {% set coarse = last.range|default('wide') != 'around' %}
            _DIALOG_TEXT MSG="Applied now. {'Phase 2 of Ellis method: a fine test in 0.001 steps around this value, to pin it down.' if coarse else 'Next: the extrusion multiplier test, which uses this PA.'}"
            _DIALOG_BUTTON LABEL="Fine PA test around {fmt % value}" ACTION="CAL_FILAMENT TEST=pa GATE={last.gate} RANGE=around"{' STYLE=primary' if coarse else ''}
            _DIALOG_BUTTON LABEL="Extrusion multiplier test" ACTION="CAL_FILAMENT TEST=em GATE={last.gate}"{'' if coarse else ' STYLE=primary'}
        {% elif test == 'em' %}
            _DIALOG_BUTTON LABEL="Fine EM test around {fmt % value}" ACTION="CAL_FILAMENT TEST=em GATE={last.gate} RANGE=around"{' STYLE=primary' if last.range|default('wide') != 'around' else ''}
        {% else %}
            _DIALOG_TEXT MSG="Last clean band {'%.1f' % picked} mm³/s, saved as {fmt % value}."
        {% endif %}
        _DIALOG_BUTTON LABEL="Pick again" ACTION=_CAL_FILAMENT_RESULT FOOTER=1
        _DIALOG_BUTTON LABEL="Done" ACTION=_RETUNE_FILAMENT FOOTER=1 STYLE=primary
        _DIALOG_SHOW
    {% endif %}

[gcode_shell_command spoolman_tuning]
command: python3 /home/pi/printer_data/config/tools/spoolman_tuning.py
timeout: 30.0
verbose: True

[gcode_macro _CAL_FILAMENT_RESTORE]
description: After a PA/EM test print ends (from _END_JOB): put back acceleration and flow, and on a cancel the PA from before the test. REASON=complete|cancel
gcode:
    {% set last = printer.save_variables.variables.cal_last|default({}) %}
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    M221 S100
    {% if params.REASON|default('complete') == 'cancel' and last.restore_pa is defined %}
        SET_PRESSURE_ADVANCE ADVANCE={last.restore_pa}
    {% endif %}
