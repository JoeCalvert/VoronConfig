# NOZZLE_CHANGE: guided Revo nozzle swap.
#
#   1. Unload the filament if any is loaded (cut and park it in its gate), turn
#      the nozzle heater off, move to SERVICE_POSITION.
#   2. You swap the nozzle (follow E3D's Revo instructions), then pick the new
#      size. That runs NOZZLE_SET, which START_PRINT's nozzle check uses.
#   3. A reminder to switch the PrusaSlicer printer profile. The nozzle's
#      maintenance counter restarts. START_PRINT's
#      Beacon contact calibration measures the new nozzle's height at the next
#      print, so there's no Z offset to set by hand.

[gcode_macro NOZZLE_CHANGE]
description: Guided nozzle swap: unload, move to the front, then record the new size
gcode:
    {% set fitted = printer.save_variables.variables.nozzle_diameter|default(0)|float %}
    {% set mmu = printer.mmu|default(None) %}
    {% set loaded = mmu and mmu.enabled and mmu.filament_pos|int != 0 %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("NOZZLE_CHANGE: not during a print") }
    {% endif %}
    _DIALOG TITLE="Change the nozzle"
    _DIALOG_TEXT MSG="Fitted now: {('%.2f mm' % fitted) if fitted else 'not recorded'}."
    _DIALOG_TEXT MSG="{'First the filament is unloaded, then the' if loaded else 'The'} nozzle heater goes off and the toolhead moves to the front."
    _DIALOG_BUTTON LABEL="Start" ACTION=_NOZZLE_CHANGE_PREPARE STYLE=primary FOOTER=1
    _DIALOG_BUTTON LABEL="I've already swapped it" ACTION=_NOZZLE_CHANGE_SIZE FOOTER=1
    _DIALOG_BUTTON LABEL="Back" ACTION=MENU FOOTER=1
    _DIALOG_SHOW

[gcode_macro _NOZZLE_CHANGE_PREPARE]
description: Nozzle change step 1: unload, heater off, service position
gcode:
    {% set mmu = printer.mmu|default(None) %}
    _DIALOG_CLOSE
    {% if mmu and mmu.enabled and mmu.filament_pos|int != 0 %}
        MMU_UNLOAD
    {% endif %}
    M104 S0
    SERVICE_POSITION
    _NOZZLE_CHANGE_SIZE

[gcode_macro _NOZZLE_CHANGE_SIZE]
description: Nozzle change step 2: pick the new size
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set mmu = printer.mmu|default(None) %}
    _DIALOG TITLE="Change the nozzle"
    {% if mmu and mmu.enabled and mmu.filament_pos|int != 0 %}
        _DIALOG_TEXT MSG="Filament is still loaded. Unload it before swapping the nozzle."
    {% endif %}
    _DIALOG_TEXT MSG="Swap the nozzle (follow E3D's Revo instructions), then pick the one you fitted:"
    {% for d, t in v.nozzles %}
        {% if loop.index0 % 3 == 0 %}_DIALOG_ROW{% endif %}
        _DIALOG_BUTTON LABEL="{'%.2f' % d}{({'brass': '', 'hf': ' HF', 'obxidian': ' ObXidian'})[t]}" ACTION="_NOZZLE_CHANGE_DONE DIAMETER={d} TYPE={t}"
        {% if loop.index0 % 3 == 2 or loop.last %}_DIALOG_ROW_END{% endif %}
    {% endfor %}
    _DIALOG_BUTTON LABEL="Cancel" ACTION=_DIALOG_CLOSE FOOTER=1
    _DIALOG_SHOW

[gcode_macro _NOZZLE_CHANGE_DONE]
description: Nozzle change step 3: record the nozzle and remind about the slicer. DIAMETER=<mm> TYPE=brass|hf|obxidian
gcode:
    {% set t = params.TYPE|default('brass')|lower %}
    {% set label = ('%.2f' % params.DIAMETER|float) ~ ({'brass': '', 'hf': ' HF', 'obxidian': ' ObXidian'})[t] %}
    NOZZLE_SET DIAMETER={params.DIAMETER|float} TYPE={t}
    _MAINTENANCE_RESET ITEM=nozzle QUIET=1
    _DIALOG TITLE="Nozzle recorded"
    _DIALOG_TEXT MSG="Recorded {label}."
    _DIALOG_TEXT MSG="Switch PrusaSlicer to the Revo {label} printer. START_PRINT refuses files sliced for another nozzle, and measures the new nozzle's height itself."
    _DIALOG_BUTTON LABEL="Park" ACTION=_CLOSE_AND_PARK FOOTER=1
    _DIALOG_BUTTON LABEL="Done" ACTION=_DIALOG_CLOSE FOOTER=1 STYLE=primary
    _DIALOG_SHOW
