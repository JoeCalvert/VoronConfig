# CALIBRATE: the routine calibrations in one dialog, each doing its own
# set-up (homing, QGL) so you don't need to remember the commands. RETUNE
# (retune.cfg) uses the same macros, step by step.
#
# Where results go:
# - PID and input shaper: printer.cfg's SAVE_CONFIG block. PID_CALIBRATE and
#   SHAPER_CALIBRATE apply their result at once and stage it; the result
#   dialog's "Save" runs SAVE_CONFIG (Klipper restarts). Until then you can
#   test with the new values, and a restart discards them.
# - Shake&Tune: graphs in ShakeTune_results, for diagnosis. They don't change
#   any settings.
# - Happy Hare's own calibrations: RETUNE -> ERCF tunes, or its KlipperScreen panel.
# - PA/EM test prints: filament_tests.cfg (results kept per filament).
#
# Every step macro takes BACK=<macro> for the dialog to return to.

[gcode_macro CALIBRATE]
description: Calibration menu: PID, input shaper, belts, full bed mesh, PA/EM tests
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("CALIBRATE: not during a print") }
    {% endif %}
    _DIALOG TITLE="Calibrate"
    _DIALOG_TEXT MSG="Each one homes and levels first if needed. Retune has every tune, including the ERCF, with instructions."
    _DIALOG_BUTTON LABEL="Retune (all tunes, with instructions)" ACTION=RETUNE STYLE=primary
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Nozzle PID ({v.print_default_extruder_temp}°C)" ACTION="_CAL_PID HEATER=extruder TARGET={v.print_default_extruder_temp}"
    _DIALOG_BUTTON LABEL="Bed PID ({v.print_default_bed_temp}°C)" ACTION="_CAL_PID HEATER=heater_bed TARGET={v.print_default_bed_temp}"
    _DIALOG_ROW_END
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Input shaper" ACTION=_CAL_SHAPER_KLIPPER
    _DIALOG_BUTTON LABEL="Shaper graphs" ACTION=_CAL_SHAPER
    _DIALOG_BUTTON LABEL="Belt comparison" ACTION=_CAL_BELTS
    _DIALOG_ROW_END
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="PA test print" ACTION="CAL_FILAMENT TEST=pa"
    _DIALOG_BUTTON LABEL="EM test print" ACTION="CAL_FILAMENT TEST=em"
    _DIALOG_ROW_END
    _DIALOG_BUTTON LABEL="Full bed mesh (to inspect the bed)" ACTION=_CAL_MESH
    _DIALOG_BUTTON LABEL="Back" ACTION=MENU FOOTER=1
    _DIALOG_SHOW

[gcode_macro _CAL_PREP]
description: Home if needed and level the gantry if it isn't
gcode:
    _CG28
    {% if not printer.quad_gantry_level.applied %}
        COARSE_QGL
    {% endif %}

[gcode_macro _CAL_PID]
description: PID-tune a heater, then show the result. HEATER=extruder|heater_bed TARGET=<C> [BACK=<macro>]
gcode:
    {% set heater = params.HEATER|default('extruder') %}
    {% if heater not in ['extruder', 'heater_bed'] %}
        { action_raise_error("_CAL_PID: HEATER must be extruder or heater_bed") }
    {% endif %}
    _DIALOG_CLOSE
    {% if heater == 'extruder' %}
        # Tune where it prints: just above the bed, part fan at a typical speed.
        _CAL_PREP
        G90
        G1 X175 Y175 F{printer["gcode_macro _USER_VARIABLES"].travel_speed * 60}
        G1 Z5 F{printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60}
        M106 S64
    {% endif %}
    PID_CALIBRATE HEATER={heater} TARGET={params.TARGET|float}
    M107
    _CAL_PID_RESULT HEATER={heater} BACK={params.BACK|default('CALIBRATE')}

[gcode_macro _CAL_PID_RESULT]
description: Show the PID values PID_CALIBRATE found, with Save. HEATER=<name> [BACK=<macro>]
gcode:
    {% set heater = params.HEATER %}
    {% set back = params.BACK|default('CALIBRATE') %}
    {% set new = printer.configfile.save_config_pending_items[heater]|default({}) %}
    _DIALOG TITLE="PID result: {heater}"
    {% if new.pid_kp is defined %}
        _DIALOG_TEXT MSG="pid_kp {new.pid_kp}   pid_ki {new.pid_ki}   pid_kd {new.pid_kd}"
        _DIALOG_TEXT MSG="These are active now. Save keeps them (Klipper restarts)."
        _DIALOG_BUTTON LABEL="Save (restarts Klipper)" ACTION=_CAL_SAVE FOOTER=1 STYLE=primary
    {% else %}
        _DIALOG_TEXT MSG="No result found. Check the console."
    {% endif %}
    _DIALOG_BUTTON LABEL="Back" ACTION={back} FOOTER=1
    _DIALOG_SHOW

[gcode_macro _CAL_SHAPER_KLIPPER]
description: Klipper's SHAPER_CALIBRATE: measures both axes, applies the recommended shapers and stages them. [BACK=<macro>]
gcode:
    _DIALOG_CLOSE
    _CAL_PREP
    SHAPER_CALIBRATE
    _CAL_SHAPER_RESULT BACK={params.BACK|default('CALIBRATE')}

[gcode_macro _CAL_SHAPER_RESULT]
description: Show the shapers SHAPER_CALIBRATE chose, with Save. [BACK=<macro>]
gcode:
    {% set back = params.BACK|default('CALIBRATE') %}
    {% set new = printer.configfile.save_config_pending_items.input_shaper|default({}) %}
    _DIALOG TITLE="Input shaper result"
    {% if new.shaper_freq_x is defined %}
        _DIALOG_TEXT MSG="X: {new.shaper_type_x} at {new.shaper_freq_x} Hz.  Y: {new.shaper_type_y} at {new.shaper_freq_y} Hz."
        _DIALOG_TEXT MSG="The console shows the highest acceleration each shaper allows before it smooths detail. Use the lower of X and Y as max_accel."
        _DIALOG_TEXT MSG="Active now, so you can test-print. Save keeps them (Klipper restarts)."
        _DIALOG_BUTTON LABEL="Save (restarts Klipper)" ACTION=_CAL_SAVE FOOTER=1 STYLE=primary
    {% else %}
        _DIALOG_TEXT MSG="No result found. Check the console."
    {% endif %}
    _DIALOG_BUTTON LABEL="Back" ACTION={back} FOOTER=1
    _DIALOG_SHOW

[gcode_macro _CAL_SAVE]
description: Save staged calibration results (SAVE_CONFIG restarts Klipper)
gcode:
    _DIALOG_CLOSE
    SAVE_CONFIG

[gcode_macro _CAL_SHAPER]
description: Shake&Tune input shaper graphs for both axes (diagnosis; changes nothing). [BACK=<macro>]
gcode:
    _DIALOG_CLOSE
    _CAL_PREP
    AXES_SHAPER_CALIBRATION
    _CAL_DONE MSG="Graphs are in ShakeTune_results. One clean peak per axis is the goal. Extra peaks usually mean something loose." BACK={params.BACK|default('CALIBRATE')}

[gcode_macro _CAL_BELTS]
description: Shake&Tune belt comparison. [BACK=<macro>]
gcode:
    _DIALOG_CLOSE
    _CAL_PREP
    COMPARE_BELTS_RESPONSES
    _CAL_DONE MSG="Graphs are in ShakeTune_results. Aim for 90% similarity or better with the main peaks at the same frequency." BACK={params.BACK|default('CALIBRATE')}

[gcode_macro _CAL_AXES_MAP]
description: Shake&Tune axes map: checks the Beacon accelerometer's orientation. [BACK=<macro>]
gcode:
    _DIALOG_CLOSE
    _CAL_PREP
    G90
    G1 X175 Y175 Z20 F{printer["gcode_macro _USER_VARIABLES"].travel_speed * 60}
    AXES_MAP_CALIBRATION
    _CAL_DONE MSG="The console shows the detected axes map. If it isn't x,y,z, set accel_axes_map in [beacon] to it (config/hardware/probe.cfg)." BACK={params.BACK|default('CALIBRATE')}

[gcode_macro _CAL_MESH]
description: Full (non-adaptive) bed mesh to inspect the bed. [BACK=<macro>]
gcode:
    _DIALOG_CLOSE
    _CAL_PREP
    BED_MESH_CALIBRATE
    _CAL_DONE MSG="Open the bed mesh view in Fluidd. Look along all four edges: a sudden drop or jump means Beacon is partly off the plate there." BACK={params.BACK|default('CALIBRATE')}

[gcode_macro _CAL_DONE]
description: Calibration finished. MSG=<text> [BACK=<macro>]
gcode:
    _DIALOG TITLE="Done"
    _DIALOG_TEXT MSG="{params.MSG|default('')}"
    _DIALOG_BUTTON LABEL="Park" ACTION=_CLOSE_AND_PARK FOOTER=1
    _DIALOG_BUTTON LABEL="Back" ACTION={params.BACK|default('CALIBRATE')} FOOTER=1
    _DIALOG_SHOW
