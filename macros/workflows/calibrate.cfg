# CALIBRATE: the routine calibrations in one dialog, each doing its own
# set-up (homing, QGL) so you don't need to remember the commands.
#
# PID results: PID_CALIBRATE stages its values for SAVE_CONFIG, but the PID
# values live in config/hardware/extruder.cfg and heated_bed.cfg (included
# files), and SAVE_CONFIG refuses to override those. So the result dialog
# shows the new values to copy into the file instead.
#
# Shake&Tune writes its graphs to ShakeTune_results in the config folder.
# Copy the shaper you choose into config/software/input_shaper.cfg.
#
# Happy Hare's own calibrations are in its KlipperScreen panel.

[gcode_macro CALIBRATE]
description: Calibration menu: PID, input shaper, belts, full bed mesh
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("CALIBRATE: not during a print") }
    {% endif %}
    _DIALOG TITLE="Calibrate"
    _DIALOG_TEXT MSG="Each one homes and levels first if needed. Results go to the console (Shake&Tune also saves graphs)."
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Nozzle PID ({v.print_default_extruder_temp}°C)" ACTION="_CAL_PID HEATER=extruder TARGET={v.print_default_extruder_temp}"
    _DIALOG_BUTTON LABEL="Bed PID ({v.print_default_bed_temp}°C)" ACTION="_CAL_PID HEATER=heater_bed TARGET={v.print_default_bed_temp}"
    _DIALOG_ROW_END
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Input shaper" ACTION=_CAL_SHAPER
    _DIALOG_BUTTON LABEL="Belt comparison" ACTION=_CAL_BELTS
    _DIALOG_ROW_END
    _DIALOG_BUTTON LABEL="Full bed mesh (to inspect the bed)" ACTION=_CAL_MESH
    _DIALOG_TEXT MSG="MMU calibrations: Happy Hare's KlipperScreen panel."
    _DIALOG_BUTTON LABEL="Back" ACTION=MENU FOOTER=1
    _DIALOG_SHOW

[gcode_macro _CAL_PREP]
description: Home if needed and level the gantry if it isn't
gcode:
    _CG28
    {% if not printer.quad_gantry_level.applied %}
        COARSE_QGL
    {% endif %}

[gcode_macro _CAL_PID]
description: PID-tune a heater, then show the values to copy. HEATER=extruder|heater_bed TARGET=<C>
gcode:
    {% set heater = params.HEATER|default('extruder') %}
    {% if heater not in ['extruder', 'heater_bed'] %}
        { action_raise_error("_CAL_PID: HEATER must be extruder or heater_bed") }
    {% endif %}
    _DIALOG_CLOSE
    {% if heater == 'extruder' %}
        # Tune where it prints: just above the bed, part fan at a typical speed.
        _CAL_PREP
        G90
        G1 X175 Y175 F{printer["gcode_macro _USER_VARIABLES"].travel_speed * 60}
        G1 Z5 F{printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60}
        M106 S64
    {% endif %}
    PID_CALIBRATE HEATER={heater} TARGET={params.TARGET|float}
    M107
    _CAL_PID_RESULT HEATER={heater}

[gcode_macro _CAL_PID_RESULT]
description: Show the PID values PID_CALIBRATE found. HEATER=<name>
gcode:
    {% set heater = params.HEATER %}
    {% set new = printer.configfile.save_config_pending_items[heater]|default({}) %}
    {% set file = 'config/hardware/extruder.cfg' if heater == 'extruder' else 'config/hardware/heated_bed.cfg' %}
    _DIALOG TITLE="PID result: {heater}"
    {% if new.pid_kp is defined %}
        _DIALOG_TEXT MSG="pid_kp: {new.pid_kp}   pid_ki: {new.pid_ki}   pid_kd: {new.pid_kd}"
        _DIALOG_TEXT MSG="Copy these into {file} and restart Klipper. Don't use SAVE_CONFIG: these values live in that file, so it would refuse."
    {% else %}
        _DIALOG_TEXT MSG="No result found. Check the console."
    {% endif %}
    _DIALOG_BUTTON LABEL="Back" ACTION=CALIBRATE FOOTER=1
    _DIALOG_SHOW

[gcode_macro _CAL_SHAPER]
description: Shake&Tune input shaper measurement for both axes
gcode:
    _DIALOG_CLOSE
    _CAL_PREP
    AXES_SHAPER_CALIBRATION
    _CAL_DONE MSG="Input shaper graphs are in ShakeTune_results. Copy the shaper you choose into config/software/input_shaper.cfg."

[gcode_macro _CAL_BELTS]
description: Shake&Tune belt comparison
gcode:
    _DIALOG_CLOSE
    _CAL_PREP
    COMPARE_BELTS_RESPONSES
    _CAL_DONE MSG="Belt graphs are in ShakeTune_results."

[gcode_macro _CAL_MESH]
description: Full (non-adaptive) bed mesh to inspect the bed
gcode:
    _DIALOG_CLOSE
    _CAL_PREP
    BED_MESH_CALIBRATE
    _CAL_DONE MSG="Open the bed mesh view in Fluidd to inspect it. START_PRINT makes its own adaptive mesh, so nothing needs saving."

[gcode_macro _CAL_DONE]
description: Calibration finished. MSG=<text>
gcode:
    _DIALOG TITLE="Calibration done"
    _DIALOG_TEXT MSG="{params.MSG|default('')}"
    _DIALOG_BUTTON LABEL="Park" ACTION=_CLOSE_AND_PARK FOOTER=1
    _DIALOG_BUTTON LABEL="Back" ACTION=CALIBRATE FOOTER=1
    _DIALOG_SHOW
