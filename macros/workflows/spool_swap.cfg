# SPOOL_SWAP: guided spool change for one gate.
#
#   1. Pick the gate.
#   2. Its filament is unloaded from the toolhead if it's the loaded one,
#      then ejected from the gate (MMU_EJECT).
#   3. You change the spool, scan its NFC tag, and push the filament into the
#      gate. Preload pulls it in (MMU_PRELOAD); scanning first lets Happy
#      Hare attach the Spoolman spool to the gate.
#   4. The gate's new material and name are shown, so a wrong scan is
#      obvious.
#
# Happy Hare refuses eject and preload while actively printing. During an MMU
# pause the recovery dialog has its own preload button.

[gcode_macro SPOOL_SWAP]
description: Guided spool change. Usage: SPOOL_SWAP [GATE=<n>] (no GATE: pick from a list)
gcode:
    {% set mmu = printer.mmu %}
    {% if mmu.print_state in ['started', 'printing'] %}
        { action_raise_error("SPOOL_SWAP: not while printing (Happy Hare refuses eject and preload)") }
    {% endif %}
    {% if params.GATE is defined %}
        _SPOOL_SWAP_EJECT GATE={params.GATE|int}
    {% else %}
        _DIALOG TITLE="Change a spool"
        _DIALOG_TEXT MSG="Which gate?"
        {% for g in range(mmu.num_gates) %}
            {% set what = [mmu.gate_material[g], mmu.gate_filament_name[g]]|select|join(' ') or ('empty' if mmu.gate_status[g] == 0 else 'no filament info') %}
            _DIALOG_BUTTON LABEL="{('Gate %d: %s' % (g, what))|replace('%c' % 35, '')|replace(';', '')|replace('*', '')|replace('"', '')|replace('|', '')}" ACTION="_SPOOL_SWAP_EJECT GATE={g}"
        {% endfor %}
        _DIALOG_BUTTON LABEL="Back" ACTION=MENU FOOTER=1
        _DIALOG_SHOW
    {% endif %}

[gcode_macro _SPOOL_SWAP_EJECT]
description: Spool swap step 2: unload if needed, eject the gate. GATE=<n>
gcode:
    {% set mmu = printer.mmu %}
    {% set g = params.GATE|int %}
    _DIALOG_CLOSE
    {% if mmu.gate_status[g] != 0 %}
        # MMU_EJECT unloads the toolhead first if this gate is the loaded one.
        MMU_EJECT GATE={g}
    {% endif %}
    _SPOOL_SWAP_LOAD GATE={g}

[gcode_macro _SPOOL_SWAP_LOAD]
description: Spool swap step 3: change the spool, then preload. GATE=<n>
gcode:
    {% set g = params.GATE|int %}
    _DIALOG TITLE="Change the spool on gate {g}"
    _DIALOG_TEXT MSG="Take the old spool off and put the new one on."
    _DIALOG_TEXT MSG="Scan its NFC tag, push the filament into gate {g}, then press Preload."
    _DIALOG_BUTTON LABEL="Preload gate {g}" ACTION="_SPOOL_SWAP_PRELOAD GATE={g}" STYLE=primary FOOTER=1
    _DIALOG_BUTTON LABEL="Leave it empty" ACTION=_DIALOG_CLOSE FOOTER=1
    _DIALOG_SHOW

[gcode_macro _SPOOL_SWAP_PRELOAD]
description: Spool swap step 4: preload, then show the result. GATE=<n>
gcode:
    _DIALOG_CLOSE
    MMU_PRELOAD GATE={params.GATE|int}
    _ENDLESS_SPOOL_AUTOGROUP
    _SPOOL_SWAP_RESULT GATE={params.GATE|int}

[gcode_macro _SPOOL_SWAP_RESULT]
description: Spool swap result. GATE=<n>
gcode:
    {% set mmu = printer.mmu %}
    {% set g = params.GATE|int %}
    {% set what = [mmu.gate_material[g], mmu.gate_filament_name[g]]|select|join(' ') or 'no filament info (tag not read?)' %}
    _DIALOG TITLE="Gate {g}"
    {% if mmu.gate_status[g] > 0 %}
        _DIALOG_TEXT MSG="{('Loaded: %s.' % what)|replace('%c' % 35, '')|replace(';', '')|replace('*', '')|replace('"', '')|replace('|', '')}"
        _DIALOG_BUTTON LABEL="Done" ACTION=_DIALOG_CLOSE STYLE=primary FOOTER=1
        _DIALOG_BUTTON LABEL="Change another" ACTION=SPOOL_SWAP FOOTER=1
    {% else %}
        _DIALOG_TEXT MSG="The filament didn't reach the gate sensor. Push it in a little further and try again."
        _DIALOG_BUTTON LABEL="Try again" ACTION="_SPOOL_SWAP_PRELOAD GATE={g}" STYLE=primary FOOTER=1
        _DIALOG_BUTTON LABEL="Close" ACTION=_DIALOG_CLOSE FOOTER=1
    {% endif %}
    _DIALOG_SHOW
