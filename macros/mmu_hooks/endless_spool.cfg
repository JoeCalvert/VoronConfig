# Endless spool groups, kept up to date automatically.
#
# Happy Hare only switches to another gate on runout if both gates are in the
# same endless spool group, and the groups are set by hand
# (MMU_ENDLESS_SPOOL GROUPS=...). With NFC and Spoolman, each gate already
# knows its filament, so this groups gates holding the same filament (same
# material and filament name). A gate with no filament name stays on its own.
#
# Runs at every print start (PREFLIGHT_CHECK), after a spool swap and in
# MMU_CHECKUP. Groups set by hand are replaced the next time it runs.

[gcode_macro _ENDLESS_SPOOL_AUTOGROUP]
description: Put gates holding the same filament (material and name) in the same endless spool group
gcode:
    {% set mmu = printer.mmu|default(None) %}
    {% if mmu and mmu.enabled %}
        {% set keys = [] %}
        {% set groups = [] %}
        {% for g in range(mmu.num_gates) %}
            {% set name = mmu.gate_filament_name[g]|default('')|string|trim|lower %}
            {% set key = (mmu.gate_material[g]|default('')|string|lower ~ '/' ~ name) if name else ('gate%d' % g) %}
            {% if key not in keys %}
                {% set _ = keys.append(key) %}
            {% endif %}
            {% set _ = groups.append(keys.index(key)) %}
        {% endfor %}
        {% if groups != mmu.endless_spool_groups|list %}
            MMU_ENDLESS_SPOOL GROUPS={groups|join(',')} QUIET=1
            RESPOND MSG="Endless spool groups updated from the loaded filaments: {groups|join(',')}"
        {% endif %}
    {% endif %}
