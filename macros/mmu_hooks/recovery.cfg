# MMU recovery dialog.
#
# Happy Hare runs _MMU_RECOVERY NOTIFY=1 on an MMU error (user_mmu_error_extension).
# MENU also opens it while the MMU is paused. Happy Hare shows its own pop-up
# first, and this one replaces it. If an update ever drops the hook, you still
# get Happy Hare's pop-up.
#
# The dialog says what failed, where the filament is and what the print
# needs. The buttons depend on where the filament is:
#
#   filament is                    buttons
#   loaded, right tool             Resume
#   loaded, wrong tool             Change to T<n>
#   in the extruder (stuck)        Retry unload, Service position, I've cleared it - check again
#   in the bowden / toolhead entry Back to gate, Retry T<n>
#   parked in its gate             Load T<n>, Preload gate, Use another gate
#   unknown                        Detect position
#
# Every button runs one Happy Hare command through _MMU_RECOVERY_DO, then
# shows the dialog again with the new state. The Resume button only appears,
# and only resumes, once the tool the print needs is loaded to the nozzle. To
# resume regardless (a sensor you know is wrong), use the UI's own Resume.
#
# Only public Happy Hare commands and status fields are used (see
# macros/system/dependencies.cfg).

[gcode_macro _MMU_RECOVERY]
description: Show the MMU recovery dialog. [NOTE=<text shown at the top>] [NOTIFY=1 to also send a notification]
gcode:
    {% set mmu = printer.mmu %}
    {% set paused = mmu.print_state in ['pause_locked', 'paused'] %}
    {% set pos = mmu.filament_pos|int %}
    {% set need = mmu.next_tool if mmu.next_tool >= 0 else mmu.tool %}
    {% set gate = mmu.ttg_map[need] if need >= 0 else mmu.gate %}
    # Dialog text can't contain # ; * " or | (see macros/ui/dialog.cfg).
    {% set reason = (mmu.reason_for_pause|default('')|string)|replace('\n', '. ')|replace('#', '')|replace(';', ',')|replace('*', '')|replace('"', "'")|replace('|', '/') %}

    {% if pos == 10 %}
        {% set where = 'loaded to the nozzle (T%d)' % mmu.tool %}
    {% elif pos >= 7 %}
        {% set where = 'in the extruder, short of the nozzle' %}
    {% elif pos >= 5 %}
        {% set where = 'at the toolhead entry, not in the extruder gears' %}
    {% elif pos >= 1 %}
        {% set where = 'in the bowden, between the MMU and the toolhead' %}
    {% elif pos == 0 %}
        {% set where = 'parked in gate %d' % mmu.gate %}
    {% else %}
        {% set where = 'unknown' %}
    {% endif %}

    _DIALOG TITLE="{'MMU paused' if paused else 'MMU'}"
    {% if params.NOTE %}
        _DIALOG_TEXT MSG="{params.NOTE}"
    {% endif %}
    {% if reason %}
        _DIALOG_TEXT MSG="What happened: {reason}"
    {% endif %}
    _DIALOG_TEXT MSG="Filament: {where}."
    {% if paused and need >= 0 %}
        _DIALOG_TEXT MSG="The print needs T{need} (gate {gate}) loaded to the nozzle."
    {% endif %}
    {% if paused %}
        {% set off_after = ((printer.configfile.settings.mmu|default({})).disable_heater|default(600)|int / 60)|round|int %}
        {% if printer.extruder.target > 0 %}
            _DIALOG_TEXT MSG="Nozzle at {printer.extruder.temperature|round|int}°C. It turns off {off_after} min after the pause unless you press Keep hot."
        {% else %}
            _DIALOG_TEXT MSG="Nozzle heater is off. Keep hot turns it back on."
        {% endif %}
    {% endif %}

    # What to do, by where the filament is.
    {% if pos == 10 and (need < 0 or mmu.tool == need) %}
        {% if paused %}
            _DIALOG_BUTTON LABEL="Resume the print" ACTION=_MMU_RECOVERY_RESUME STYLE=primary
        {% else %}
            _DIALOG_TEXT MSG="Nothing to fix."
        {% endif %}
    {% elif pos == 10 %}
        _DIALOG_BUTTON LABEL="Change to T{need}" ACTION="_MMU_RECOVERY_DO STEP=load TOOL={need}" STYLE=primary
    {% elif pos >= 7 %}
        _DIALOG_BUTTON LABEL="Retry the unload" ACTION="_MMU_RECOVERY_DO STEP=unload" STYLE=primary
        _DIALOG_BUTTON LABEL="Service position (to clear it by hand)" ACTION="_MMU_RECOVERY_DO STEP=service"
        _DIALOG_BUTTON LABEL="I've cleared it - check again" ACTION="_MMU_RECOVERY_DO STEP=detect"
    {% elif pos >= 1 %}
        _DIALOG_BUTTON LABEL="Back to the gate" ACTION="_MMU_RECOVERY_DO STEP=unload" STYLE=primary
        {% if need >= 0 %}
            _DIALOG_BUTTON LABEL="Retry loading T{need}" ACTION="_MMU_RECOVERY_DO STEP=load TOOL={need}"
        {% endif %}
    {% elif pos == 0 %}
        {% if need >= 0 %}
            # An empty gate (a runout) needs its spool reloaded first.
            {% set empty = mmu.gate_status[gate] == 0 %}
            _DIALOG_BUTTON LABEL="Preload gate {gate} (after reloading its spool)" ACTION="_MMU_RECOVERY_DO STEP=preload GATE={gate}" STYLE={'primary' if empty else 'secondary'}
            _DIALOG_BUTTON LABEL="Load T{need}" ACTION="_MMU_RECOVERY_DO STEP=load TOOL={need}" STYLE={'secondary' if empty else 'primary'}
            _DIALOG_BUTTON LABEL="Use another gate for T{need}" ACTION="_MMU_RECOVERY_GATES TOOL={need}"
        {% endif %}
    {% else %}
        _DIALOG_BUTTON LABEL="Detect the filament position" ACTION="_MMU_RECOVERY_DO STEP=detect" STYLE=primary
    {% endif %}
    _DIALOG_BUTTON LABEL="Refresh" ACTION=_MMU_RECOVERY STYLE=secondary

    {% if paused %}
        _DIALOG_BUTTON LABEL="Keep hot" ACTION="_MMU_RECOVERY_DO STEP=hot" FOOTER=1
        _DIALOG_BUTTON LABEL="Cancel print" ACTION="_CONFIRM_CANCEL BACK=_MMU_RECOVERY" FOOTER=1 STYLE=error
    {% else %}
        _DIALOG_BUTTON LABEL="Close" ACTION=_DIALOG_CLOSE FOOTER=1
    {% endif %}
    _DIALOG_SHOW
    {% if params.NOTIFY|default(0)|int %}
        _NOTIFY MSG="MMU paused: {reason or 'needs attention'}"
    {% endif %}

[gcode_macro _MMU_RECOVERY_DO]
description: Run one recovery step, then show the recovery dialog again. STEP=load|unload|detect|preload|remap|hot|service [TOOL=] [GATE=]
gcode:
    {% set step = params.STEP|default('')|lower %}
    _DIALOG_CLOSE
    {% if step == 'load' %}
        MMU_CHANGE_TOOL TOOL={params.TOOL|int}
    {% elif step == 'unload' %}
        MMU_UNLOAD
    {% elif step == 'detect' %}
        MMU_RECOVER
    {% elif step == 'preload' %}
        MMU_PRELOAD GATE={params.GATE|int}
    {% elif step == 'remap' %}
        MMU_TTG_MAP TOOL={params.TOOL|int} GATE={params.GATE|int} QUIET=1
        MMU_CHANGE_TOOL TOOL={params.TOOL|int}
    {% elif step == 'hot' %}
        MMU_UNLOCK
    {% elif step == 'service' %}
        SERVICE_POSITION
    {% else %}
        { action_raise_error("_MMU_RECOVERY_DO: unknown STEP '%s'" % step) }
    {% endif %}
    _MMU_RECOVERY

[gcode_macro _MMU_RECOVERY_GATES]
description: Pick another gate for a tool. TOOL=<n>
gcode:
    {% set mmu = printer.mmu %}
    {% set tool = params.TOOL|int %}
    {% set current = mmu.ttg_map[tool] %}
    _DIALOG TITLE="Use another gate for T{tool}"
    _DIALOG_TEXT MSG="T{tool} is mapped to gate {current} ({mmu.gate_material[current] or 'unknown material'}). Pick a gate with filament in it:"
    {% set ns = namespace(any=False) %}
    {% for g in range(mmu.num_gates) if g != current and mmu.gate_status[g] > 0 %}
        {% set ns.any = True %}
        {% set label = ('Gate %d: %s' % (g, [mmu.gate_material[g], mmu.gate_filament_name[g]]|select|join(' ') or 'no filament info'))|replace('#', '')|replace(';', '')|replace('*', '')|replace('"', '')|replace('|', '') %}
        _DIALOG_BUTTON LABEL="{label}" ACTION="_MMU_RECOVERY_DO STEP=remap TOOL={tool} GATE={g}"
    {% endfor %}
    {% if not ns.any %}
        _DIALOG_TEXT MSG="No other gate has filament in it."
    {% endif %}
    _DIALOG_BUTTON LABEL="Back" ACTION=_MMU_RECOVERY FOOTER=1
    _DIALOG_SHOW

[gcode_macro _MMU_RECOVERY_RESUME]
description: Resume, but only once the tool the print needs is loaded to the nozzle
gcode:
    {% set mmu = printer.mmu %}
    {% set need = mmu.next_tool if mmu.next_tool >= 0 else mmu.tool %}
    {% if need != -2 and (mmu.filament_pos|int != 10 or (need >= 0 and mmu.tool != need)) %}
        _MMU_RECOVERY NOTE="Not resuming yet: T{need} isn't loaded to the nozzle."
    {% else %}
        _DIALOG_CLOSE
        RESUME
    {% endif %}

[gcode_macro MMU_CHECKUP]
description: Check the MMU: find where the filament is, then show every gate and tool. Usage: MMU_CHECKUP [GATES=1 to also check every gate]
gcode:
    {% set printing = printer.print_stats.state == 'printing' %}
    {% if printing %}
        _MMU_CHECKUP_SHOW NOTE="Printing, so nothing was moved. This is the last known state."
    {% else %}
        _DIALOG_CLOSE
        MMU_RECOVER
        {% if params.GATES|default(0)|int %}
            MMU_CHECK_GATE ALL=1
        {% endif %}
        _MMU_CHECKUP_SHOW
    {% endif %}

[gcode_macro _MMU_CHECKUP_SHOW]
description: Show the MMU check-up summary. [NOTE=<text>]
gcode:
    {% set mmu = printer.mmu %}
    {% set state = {-1: 'not checked', 0: 'empty', 1: 'ready', 2: 'ready (buffer)'} %}
    _DIALOG TITLE="MMU check-up"
    {% if params.NOTE %}
        _DIALOG_TEXT MSG="{params.NOTE}"
    {% endif %}
    {% if mmu.filament_pos|int == 10 %}
        _DIALOG_TEXT MSG="Loaded: T{mmu.tool} from gate {mmu.gate}."
    {% elif mmu.filament_pos|int == 0 %}
        _DIALOG_TEXT MSG="Nothing loaded. The filament is parked in its gate."
    {% else %}
        _DIALOG_TEXT MSG="Filament is part-way (position {mmu.filament_pos}). Open the recovery dialog to sort it out."
    {% endif %}
    {% for g in range(mmu.num_gates) %}
        {% set tools = [] %}
        {% for t in range(mmu.ttg_map|length) if mmu.ttg_map[t] == g %}{% set _ = tools.append('T%d' % t) %}{% endfor %}
        {% set what = [mmu.gate_material[g], mmu.gate_filament_name[g]]|select|join(' ') or 'no filament info' %}
        {% set line = ('Gate %d (%s): %s - %s' % (g, tools|join(',') or 'no tool', what, state[mmu.gate_status[g]]|default('?')))|replace('#', '')|replace(';', '')|replace('*', '')|replace('"', '')|replace('|', '') %}
        _DIALOG_TEXT MSG="{line}"
    {% endfor %}
    {% if mmu.filament_pos|int not in [0, 10] %}
        _DIALOG_BUTTON LABEL="Recovery" ACTION=_MMU_RECOVERY STYLE=primary
    {% endif %}
    {% if printer.print_stats.state != 'printing' %}
        _DIALOG_BUTTON LABEL="Check every gate (moves filament)" ACTION="MMU_CHECKUP GATES=1"
    {% endif %}
    _DIALOG_BUTTON LABEL="Back" ACTION=MENU FOOTER=1
    _DIALOG_SHOW
