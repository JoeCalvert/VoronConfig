# CANCEL_PRINT itself is Happy Hare's (mmu/optional/client_macros.cfg, included
# last in printer.cfg). Happy Hare lifts Z, retracts, turns the heaters and part
# fan off, then calls this macro through user_cancel_extension in
# mmu/base/mmu_macro_vars.cfg, before Klipper's own cancel runs.
#
# This used to be a second [gcode_macro CANCEL_PRINT]. Klipper merges sections
# with the same name, so Happy Hare's definition silently replaced it and a
# cancel stopped parking the toolhead.
[gcode_macro _CANCEL_PRINT_EXTENSION]
description: Machine-side clean-up after a cancel (called by Happy Hare's CANCEL_PRINT)
gcode:
    {% set w = printer['gcode_macro _CHAMBER_WAIT'] %}
    {% set held = w.sd_held and printer.print_stats.filename == w.filename and not printer.virtual_sdcard.is_active %}
    _END_JOB REASON=cancel
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=sd_held VALUE=False
    {% if held and printer.virtual_sdcard.file_path %}
        # M25 held the reader without a user pause. Re-arm it immediately
        # before Happy Hare's BASE_CANCEL_PRINT, so Klipper closes the file
        # and records cancellation. The command lock prevents any file line
        # from running between M24 and BASE_CANCEL_PRINT.
        M24
    {% endif %}
