# Toolhead status LEDs: logo = LEDs 1-8, nozzle = LEDs 9-10 (neopixel _status_leds)
#
# One controller, _STATUS STATE=<state>, drives these LEDs. The STATUS_* macros
# the other macros call are thin wrappers around it.
# - Motion states (homing, levelling, Z calibration, meshing, cleaning, busy)
#   are static colours. No animation while the machine is homing or probing:
#   effect traffic to the CAN toolhead adds to "Timer too close" risk.
# - While printing, the logo shows the loaded filament's colour (Happy Hare's
#   gate colour, from Spoolman) through a Klipper LED template. Klipper only
#   resends it when the colour changes. Nozzle LEDs are a white work light.
# - Animated effects only for heating, cooling, part ready and errors, at 15 fps.
# - Effects are only ever stopped on this LED chain. A bare STOP_LED_EFFECTS
#   would also stop Happy Hare's gate LED effects.
# Colours come from status_leds_colors in config/variables.cfg.

[gcode_macro _STATUS]
description: Set the toolhead LEDs for a machine state. Usage: _STATUS STATE=homing
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set state = params.STATE|default('ready')|lower %}
    {% set colors = v.status_leds_colors %}
    {% set logo_idx = v.status_leds_logo_idx.split(',')|map('int')|list %}
    {% set nozzle_idx = v.status_leds_nozzle_idx.split(',')|map('int')|list %}

    # Clear what the previous state left behind, on this chain only
    STOP_LED_EFFECTS LEDS="neopixel:_status_leds"
    {% for i in logo_idx + nozzle_idx %}
        SET_LED_TEMPLATE LED=_status_leds INDEX={i} TEMPLATE=
    {% endfor %}

    {% if state in ['heating', 'cooling', 'part_ready'] %}
        SET_LED_EFFECT EFFECT=sb_logo_{state}
        SET_LED_EFFECT EFFECT=sb_nozzle_{state}
    {% elif state == 'error' %}
        SET_LED_EFFECT EFFECT=sb_critical_error
    {% elif state == 'off' %}
        SET_LED LED=_status_leds RED=0 GREEN=0 BLUE=0 WHITE=0
    {% else %}
        {% if state == 'printing' %}
            {% for i in logo_idx %}
                SET_LED_TEMPLATE LED=_status_leds INDEX={i} TEMPLATE=_status_logo_filament
            {% endfor %}
            {% set n = colors.nozzle.on %}
        {% else %}
            {% set l = colors.logo[state]|default(colors.logo.busy) if state != 'ready' else colors.logo.standby %}
            {% for i in logo_idx %}
                SET_LED LED=_status_leds INDEX={i} RED={l.r} GREEN={l.g} BLUE={l.b} WHITE={l.w} TRANSMIT=0
            {% endfor %}
            {% set n = colors.nozzle.standby if state in ['ready', 'standby'] else colors.nozzle.on %}
        {% endif %}
        {% for i in nozzle_idx %}
            SET_LED LED=_status_leds INDEX={i} RED={n.r} GREEN={n.g} BLUE={n.b} WHITE={n.w} TRANSMIT={1 if loop.last else 0}
        {% endfor %}
    {% endif %}

# Logo colour while printing: the colour of the filament in the active gate
[display_template _status_logo_filament]
text:
    {% set mmu = printer.mmu|default(None) %}
    {% if mmu and mmu.gate is defined and mmu.gate >= 0 and mmu.gate < mmu.gate_color_rgb|length %}
        {% set c = mmu.gate_color_rgb[mmu.gate] %}
        {c[0]}, {c[1]}, {c[2]}, 0.0
    {% else %}
        0.3, 0.3, 0.3, 0.0
    {% endif %}

# Happy Hare print state changes: errors and resumes drive the LEDs too
[gcode_macro _STATUS_FROM_MMU]
description: Called by Happy Hare on print state changes (user_print_state_changed_extension)
gcode:
    {% set state = params.STATE|default('')|string|lower %}
    {% if state == 'printing' and printer["gcode_macro _JOB"].phase == 'printing' %}
        _SET_STATE STATE=printing
    {% elif state in ['pause_locked', 'paused'] %}
        _SET_STATE STATE=paused
    {% endif %}

# Wrappers kept so the existing macros don't need to change
[gcode_macro STATUS_OFF]
gcode:
    _STATUS STATE=off
[gcode_macro STATUS_READY]
gcode:
    _STATUS STATE=ready
[gcode_macro STATUS_PART_READY]
gcode:
    _STATUS STATE=part_ready
[gcode_macro STATUS_BUSY]
gcode:
    _STATUS STATE=busy
[gcode_macro STATUS_HEATING]
gcode:
    _STATUS STATE=heating
[gcode_macro STATUS_COOLING]
gcode:
    _STATUS STATE=cooling
[gcode_macro STATUS_LEVELING]
gcode:
    _STATUS STATE=leveling
[gcode_macro STATUS_HOMING]
gcode:
    _STATUS STATE=homing
[gcode_macro STATUS_CLEANING]
gcode:
    _STATUS STATE=cleaning
[gcode_macro STATUS_MESHING]
gcode:
    _STATUS STATE=meshing
[gcode_macro STATUS_CALIBRATING_Z]
gcode:
    _STATUS STATE=calibrating_z
[gcode_macro STATUS_PRINTING]
gcode:
    _STATUS STATE=printing

#################################################
# Animated effects (stationary states only)
#################################################

[led_effect sb_logo_heating]
leds:
    neopixel:_status_leds (1,3,7,8,6,2)
autostart:              false
frame_rate:             15
layers:
    comet  0.3  0 add (1, 0.18, 0)

[led_effect sb_logo_cooling]
leds:
    neopixel:_status_leds (1,3,7,8,6,2)
autostart:              false
frame_rate:             15
layers:
    comet  0.3  0 add (0, 0, 1)

[led_effect sb_logo_part_ready]
autostart:              false
frame_rate:             15
leds:
    neopixel:_status_leds (1-8)
layers:
    breathing  3 1 top (0.0, 1.0, 0.0)

[led_effect sb_nozzle_heating]
autostart:              false
frame_rate:             15
leds:
    neopixel:_status_leds (9,10)
layers:
    breathing  3 1 top (1.0, 0.18, 0.0, 0.0)

[led_effect sb_nozzle_cooling]
autostart:              false
frame_rate:             15
leds:
    neopixel:_status_leds (9,10)
layers:
    breathing  3 1 top (0.0, 0.0, 1.0, 0.1)

[led_effect sb_nozzle_part_ready]
autostart:              false
frame_rate:             15
leds:
    neopixel:_status_leds (9,10)
layers:
    breathing  3 1 top (0.6, 1.0, 0.0, 0.1)

[led_effect sb_critical_error]
leds:
    neopixel:_status_leds
layers:
    strobe         1  1.5   add        (1.0,  1.0, 1.0)
    breathing      2  0     difference (0.95, 0.0, 0.0)
    static         1  0     top        (1.0,  0.0, 0.0)
autostart:              false
frame_rate:             15
run_on_error:           true
