# Startup self-check (pattern from Klippain's _KLIPPAIN_STARTUP and
# klipper-macros' CHECK_KM_CONFIG).
#
# A few seconds after Klipper starts, this checks the settings the machine's
# safety depends on. Errors stop START_PRINT from running until they're fixed
# and Klipper is restarted. Warnings are only reported (for example a public macro without a description).
#
# It checks invariants rather than repeating values, so each value still has
# one owner (mostly Happy Hare's mmu_macro_vars.cfg). The main thing it guards
# against is a Happy Hare installer run quietly replacing measured values with
# its defaults, which is how the v4 install went wrong.
#
# Run CHECK_CONFIG by hand any time. The result is also shown as a dialog:
# always when run by hand, and at startup when it finds errors.

[gcode_macro _STARTUP_CHECK_STATE]
variable_ok: False
variable_ran: False
gcode:

[delayed_gcode _STARTUP_CHECK]
initial_duration: 5
gcode:
    CHECK_CONFIG STARTUP=1

[gcode_macro CHECK_CONFIG]
description: Check the safety-critical config. START_PRINT refuses to run if this finds errors
gcode:
    {% set ns = namespace(errors=[], warnings=[]) %}
    {% set settings = printer.configfile.settings %}

    {% set cut = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}
    {% set seq = printer['gcode_macro _MMU_SEQUENCE_VARS'] %}
    {% set client = printer['gcode_macro _MMU_CLIENT_VARS'] %}
    {% set bl = printer['gcode_macro _BLOBIFIER_VARS'] %}

    # --- Other projects: is everything we use still there? ----------------
    # The list is in macros/system/dependencies.cfg.
    {% set deps = printer['gcode_macro _DEPENDENCIES'] %}
    {% set commands = printer.gcode.commands %}
    {% for c in deps.commands if c not in commands %}
        {% set _ = ns.errors.append("command " ~ c ~ " doesn't exist any more (see docs/updating.md)") %}
    {% endfor %}
    {% set mmu = printer.mmu|default({}) %}
    {% for f in deps.mmu_fields if f not in mmu %}
        {% set _ = ns.errors.append("printer.mmu." ~ f ~ " doesn't exist any more (see docs/updating.md)") %}
    {% endfor %}
    {% for macro, var in deps.settings %}
        {% if var not in printer['gcode_macro ' ~ macro]|default({}) %}
            {% set _ = ns.errors.append(macro ~ "." ~ var ~ " doesn't exist any more (see docs/updating.md)") %}
        {% endif %}
    {% endfor %}
    {% for macro, var, ours, why, level in deps.hooks %}
        {% set vars = printer['gcode_macro ' ~ macro]|default({}) %}
        {% set report = ns.errors if level == 'error' else ns.warnings %}
        {% if var not in vars %}
            {% set _ = report.append(macro ~ "." ~ var ~ " doesn't exist any more, so " ~ why ~ " (see docs/updating.md)") %}
        {% elif ours not in vars[var]|string %}
            {% set _ = report.append(var ~ " doesn't call " ~ ours ~ ", so " ~ why) %}
        {% endif %}
    {% endfor %}
    {% set hh = printer.configfile.config.mmu.happy_hare_version|default('')|string %}
    {% if hh.split('.')[:2]|join('.') != deps.happy_hare_tested %}
        {% set _ = ns.warnings.append("Happy Hare is " ~ hh ~ " but these macros were last checked against " ~ deps.happy_hare_tested ~ ". See docs/updating.md") %}
    {% endif %}

    {% if (settings.mmu|default({})).print_start_detection|default(1)|int != 1 %}
        {% set _ = ns.warnings.append("Happy Hare print_start_detection is off, so a print that stops with an error won't show the failed-print dialog") %}
    {% endif %}

    # --- Cutter pin and Blobifier: still the measured positions? -----------
    {% set pin = cut.pin_loc_xy|list|map('float')|list %}
    {% if pin == [14.0, 250.0] %}
        {% set _ = ns.errors.append("cutter pin_loc_xy is the Happy Hare installer default (14,250), not the measured position") %}
    {% endif %}
    {% if bl.brush_start|float == 67 or bl.purge_x|float == 10 %}
        {% set _ = ns.errors.append("Blobifier brush_start/purge_x are the installer defaults (67/10), not the measured positions") %}
    {% endif %}
    {% if cut.restore_position|string|lower == 'true' %}
        {% set _ = ns.errors.append("cutter restore_position is True: after each cut it drives back past the pin to where the cut started") %}
    {% endif %}

    # --- Nothing may park the toolhead on the tray during an unload --------
    {% for hook in ['user_pre_unload_extension', 'user_post_form_tip_extension'] %}
        {% if 'BLOBIFIER_PARK' in seq[hook]|default('')|string|upper %}
            {% set _ = ns.errors.append(hook ~ " calls BLOBIFIER_PARK: an unload that stops there leaves the toolhead behind the cutter pin") %}
        {% endif %}
    {% endfor %}

    # --- Park points: lift-only (-999), or right of the cutter's clearance line
    {% set lane_x = pin[0] + cut.pin_park_dist|float + (cut.safe_margin_xy|list|map('float')|list)[0] %}
    {% for name in ['park_pause', 'park_complete', 'park_cancel', 'park_runout', 'park_toolchange'] %}
        {% set x = (seq[name]|list|map('float')|list)[0] %}
        {% if x != -999 and x < lane_x %}
            {% set _ = ns.errors.append("%s X %.0f is left of X %.0f: a park from the Blobifier tray could cross the cutter pin" % (name, x, lane_x)) %}
        {% endif %}
    {% endfor %}

    # --- Probe and Z -----------------------------------------------------
    {% if 'beacon model default' not in settings %}
        {% set _ = ns.errors.append("no Beacon model 'default' saved, so Z homing would fail") %}
    {% endif %}
    {% if settings.beacon.home_method|default('')|lower != 'proximity' %}
        {% set _ = ns.errors.append("Beacon home_method isn't proximity: a plain G28 would contact-home with a possibly hot nozzle") %}
    {% endif %}
    {% if 'z_thermal_adjust' in settings %}
        {% set _ = ns.warnings.append("z_thermal_adjust is enabled, but its coefficient needs re-measuring before use") %}
    {% endif %}

    # --- Nozzle record -----------------------------------------------------
    {% if printer.save_variables.variables.nozzle_diameter is not defined %}
        {% set _ = ns.warnings.append("fitted nozzle not recorded. Run NOZZLE_SET DIAMETER=<size> to enable START_PRINT's nozzle check") %}
    {% endif %}

    # --- Every public macro has a description (shown in Mainsail and HELP) --
    {% set undocumented = [] %}
    {% for name, section in settings.items() %}
        {% if name.startswith('gcode_macro ') and not name[12:].startswith('_') and section.description|default('G-Code macro') == 'G-Code macro' %}
            {% set _ = undocumented.append(name[12:]|upper) %}
        {% endif %}
    {% endfor %}
    {% if undocumented %}
        {% set _ = ns.warnings.append("public macros without a description: " ~ undocumented|join(', ')) %}
    {% endif %}

    # --- Report ------------------------------------------------------------
    {% for w in ns.warnings %}
        RESPOND TYPE=echo MSG="CHECK_CONFIG warning: {w}"
    {% endfor %}
    {% for e in ns.errors %}
        RESPOND TYPE=error MSG="CHECK_CONFIG error: {e}"
    {% endfor %}
    {% if ns.errors %}
        SET_GCODE_VARIABLE MACRO=_STARTUP_CHECK_STATE VARIABLE=ok VALUE=False
        RESPOND TYPE=error MSG="CHECK_CONFIG: {ns.errors|length} error(s). START_PRINT is blocked until they're fixed and Klipper is restarted"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STARTUP_CHECK_STATE VARIABLE=ok VALUE=True
        {% if params.STARTUP is not defined %}
            RESPOND MSG="CHECK_CONFIG: OK ({ns.warnings|length} warning(s))"
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_STARTUP_CHECK_STATE VARIABLE=ran VALUE=True

    # Also as a dialog: always when run by hand, and at startup only for errors
    # (a standing warning shouldn't pop up on every restart).
    {% if ns.errors or params.STARTUP is not defined %}
        _DIALOG TITLE="{'Config problems: START_PRINT is blocked' if ns.errors else 'Config check'}"
        {% for e in ns.errors %}
            _DIALOG_TEXT MSG="Error: {e|replace('#', '')|replace(';', ',')|replace('*', '')|replace('"', "'")|replace('|', '/')}"
        {% endfor %}
        {% for w in ns.warnings %}
            _DIALOG_TEXT MSG="Warning: {w|replace('#', '')|replace(';', ',')|replace('*', '')|replace('"', "'")|replace('|', '/')}"
        {% endfor %}
        {% if not ns.errors and not ns.warnings %}
            _DIALOG_TEXT MSG="Everything checked is fine."
        {% endif %}
        {% if ns.errors %}
            _DIALOG_TEXT MSG="Fix the errors, then restart Klipper."
        {% endif %}
        _DIALOG_BUTTON LABEL="Close" ACTION=_DIALOG_CLOSE FOOTER=1
        _DIALOG_SHOW
    {% endif %}
