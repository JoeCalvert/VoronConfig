# Machine state: the one place that decides what the printer looks like in each
# state (toolhead LEDs, case light, filter), and the one record of the current
# print job. Macros say which state they're entering; they don't set lights or
# the filter themselves. See docs/state-table.md.

# The current print job. START_PRINT fills it; everything else reads it.
#   phase: idle -> preparing (START_PRINT running) -> prepared (START_PRINT done)
#          -> printing (POST_START_PRINT) -> complete | cancelled
[gcode_macro _JOB]
description: The current print job (set by START_PRINT, read by the other macros)
variable_phase: 'idle'
variable_chamber_temp: 0
gcode:
    {% set job = printer["gcode_macro _JOB"] %}
    RESPOND MSG="Job: phase {job.phase}, chamber target {job.chamber_temp} C. Machine state: {printer['gcode_macro _SET_STATE'].state}"

# What each state looks like. A state not listed under light or filter leaves
# that accessory as it is.
#   state         LEDs           case light            filter
#   idle          ready (dim)    -                     -
#   preparing     busy           start-print level     -
#   homing        homing         -                     -
#   heating       heating        -                     -
#   soaking       heating        -                     full (circulate)
#   leveling      leveling       -                     off
#   calibrating_z calibrating_z  -                     -
#   meshing       meshing        -                     -
#   printing      filament colour printing level        working speed if chamber target, else off
#   paused        error effect   -                     -
#   complete      off            end-of-print level    full, off after 10 min if chamber target
#   cancelled     off            off                   off
[gcode_macro _SET_STATE]
description: Enter a machine state: sets LEDs, case light and filter. Usage: _SET_STATE STATE=printing
variable_state: 'idle'
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set job = printer["gcode_macro _JOB"] %}
    {% set state = params.STATE|lower %}
    {% set leds = {'idle': 'ready', 'preparing': 'busy', 'homing': 'homing', 'heating': 'heating',
                   'soaking': 'heating', 'leveling': 'leveling', 'calibrating_z': 'calibrating_z',
                   'meshing': 'meshing', 'printing': 'printing', 'paused': 'error',
                   'complete': 'off', 'cancelled': 'off'} %}
    {% if state not in leds %}
        { action_raise_error("_SET_STATE: unknown state '%s'" % state) }
    {% endif %}

    _STATUS STATE={leds[state]}

    {% if state == 'preparing' %}
        LIGHT_ON S={v.light_intensity_start_print}
    {% elif state == 'printing' %}
        LIGHT_ON S={v.light_intensity_printing}
    {% elif state == 'complete' %}
        LIGHT_ON S={v.light_intensity_end_print}
    {% elif state == 'cancelled' %}
        LIGHT_OFF
    {% endif %}

    {% if state == 'soaking' %}
        START_FILTER SPEED=1
    {% elif state in ['leveling', 'cancelled'] %}
        STOP_FILTER
    {% elif state == 'printing' %}
        {% if job.chamber_temp > 0 %}
            START_FILTER SPEED={v.filter_working_speed}
        {% else %}
            STOP_FILTER
        {% endif %}
    {% elif state == 'complete' and job.chamber_temp > 0 %}
        START_FILTER SPEED=1
        UPDATE_DELAYED_GCODE ID=_STOP_FILTER_DELAYED DURATION=600
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_SET_STATE VARIABLE=state VALUE="'{state}'"
