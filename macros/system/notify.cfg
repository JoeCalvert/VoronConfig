# _NOTIFY: push a notification to your phone through Moonraker's notifier.
#
# Set notifier_name in config/variables.cfg to a [notifier] section in
# moonraker.conf with "events: gcode" (docs/notifications.md). Until then
# _NOTIFY only writes to the console: calling Moonraker's notify method
# without a notifier configured would be an error and stop the calling macro.
#
# Sent for the moments that need you at the machine: an MMU error, a print
# that stopped with an error, a print waiting at the preflight check or a
# planned pause, and the plate being cool enough to take off.

[gcode_macro _NOTIFY]
description: Send a notification (and echo it to the console). MSG=<text> [TITLE=<text>]
gcode:
    {% set name = printer["gcode_macro _USER_VARIABLES"].notifier_name|default('')|string %}
    {% set msg = params.MSG|default('')|string %}
    {% set title = params.TITLE|default('Voron')|string %}
    RESPOND MSG="{title}: {msg}"
    {% if name %}
        {action_call_remote_method("notify", name=name, message=title ~ ": " ~ msg)}
    {% endif %}
