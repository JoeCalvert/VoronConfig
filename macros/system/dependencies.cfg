# Everything our macros use from other projects (Happy Hare, Blobifier,
# Beacon, Shake&Tune), in one list.
#
# We only use other projects through their public surface: the G-code
# commands they document, their status fields (printer.mmu.*), and the hook
# variables in their config files. We never copy, override or call their
# internal (_underscore) macros, because those change between releases: Happy
# Hare's development branch has already removed _MMU_ERROR_DIALOG, for example.
#
# CHECK_CONFIG checks this list at startup and names anything that has gone,
# so an update that renames something shows up as a clear warning instead of
# a button failing in the middle of an MMU error.
# tools/check_deps.py fails if a macro uses something this list leaves out,
# and can check the list against a Happy Hare source tree after an update.
#
# When you update Happy Hare, see docs/updating.md.

[gcode_macro _DEPENDENCIES]
description: List of what our macros use from other projects (checked by CHECK_CONFIG)
# Happy Hare version these macros were last checked against (major.minor).
variable_happy_hare_tested: '4.1'
# G-code commands from other projects.
variable_commands: [
    'BEACON_HOME_Z_CONTACT', 'BEACON_MODEL_SELECT',
    'BLOBIFIER_CLEAN', 'BLOBIFIER_PARK',
    'MMU_CHANGE_TOOL', 'MMU_CHECK_GATE', 'MMU_EJECT', 'MMU_ENDLESS_SPOOL', 'MMU_PRELOAD', 'MMU_RECOVER', 'MMU_TTG_MAP',
    'MMU_UNLOAD', 'MMU_UNLOCK',
    'SET_PAUSE_NEXT_LAYER',   # Happy Hare's client_macros.cfg (from Mainsail's)
    'AXES_SHAPER_CALIBRATION', 'COMPARE_BELTS_RESPONSES',   # Shake&Tune
  ]
# printer.mmu status fields.
variable_mmu_fields: [
    'enabled', 'endless_spool_groups', 'filament', 'filament_pos', 'gate', 'gate_color_rgb', 'gate_filament_name',
    'gate_material', 'gate_status', 'next_tool', 'num_gates', 'print_state',
    'reason_for_pause', 'slicer_tool_map', 'tool', 'ttg_map',
  ]
# Happy Hare [mmu] parameters read from printer.configfile.settings.mmu.
variable_mmu_params: ['disable_heater']
# Hook variables in Happy Hare's mmu_macro_vars.cfg that must call our macros:
# [macro, variable, the macro of ours it must call, what breaks without it,
#  'error' to block START_PRINT or 'warning' to only report].
variable_hooks: [
    ['_MMU_STATE_VARS',  'user_print_state_changed_extension', '_STATUS_FROM_MMU',
        "the status LEDs and machine state won't follow MMU pauses", 'warning'],
    ['_MMU_CLIENT_VARS', 'user_cancel_extension',              '_CANCEL_PRINT_EXTENSION',
        "a cancel won't park or turn the heaters off", 'error'],
    ['_MMU_CLIENT_VARS', 'user_resume_extension',              'BLOBIFIER_CLEAN',
        "a resume returns from wherever the toolhead was left", 'warning'],
    ['_MMU_SEQUENCE_VARS', 'user_mmu_error_extension',         '_MMU_RECOVERY',
        "an MMU error shows Happy Hare's plain pop-up instead of the recovery dialog", 'warning'],
  ]
# Other Happy Hare / Blobifier config variables our macros read: [macro, variable].
variable_settings: [
    ['_MMU_CUT_TIP_VARS',  'pin_loc_xy'], ['_MMU_CUT_TIP_VARS', 'pin_park_dist'],
    ['_MMU_CUT_TIP_VARS',  'safe_margin_xy'], ['_MMU_CUT_TIP_VARS', 'restore_position'],
    ['_MMU_SEQUENCE_VARS', 'park_pause'], ['_MMU_SEQUENCE_VARS', 'park_complete'],
    ['_MMU_SEQUENCE_VARS', 'park_cancel'], ['_MMU_SEQUENCE_VARS', 'park_runout'],
    ['_MMU_SEQUENCE_VARS', 'park_toolchange'],
    ['_MMU_SEQUENCE_VARS', 'user_pre_unload_extension'],
    ['_MMU_SEQUENCE_VARS', 'user_post_form_tip_extension'],
    ['_BLOBIFIER_VARS',    'brush_start'], ['_BLOBIFIER_VARS', 'purge_x'],
  ]
gcode:
