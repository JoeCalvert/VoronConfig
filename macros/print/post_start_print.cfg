# Runs after Happy Hare has loaded the first tool (MMU_START_LOAD_INITIAL_TOOL).
[gcode_macro POST_START_PRINT]
description: Enter the printing state once START_PRINT and the first tool load have finished
gcode:
    {% set phase = printer["gcode_macro _JOB"].phase %}
    {% if phase != 'prepared' %}
        { action_raise_error("POST_START_PRINT: START_PRINT didn't finish (job phase is '%s'). Check the slicer start G-code order in docs/slicer.md" % phase) }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=phase VALUE="'printing'"
    _SET_STATE STATE=printing
    # No purge line: Blobifier has already purged and wiped after the first tool load
