[gcode_macro POST_START_PRINT]
description: Procedure to run after Print Start + MMU Setup (If enabled)
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set chamber_temp = printer["gcode_macro START_PRINT"].chamber_temp %}


    STATUS_PRINTING

    {% if chamber_temp > 0 %}
        START_FILTER SPEED={v.filter_working_speed}
    {% endif %}
    LIGHT_ON S={v.light_intensity_printing}

    # No purge line: Blobifier has already purged and wiped after the first tool load
