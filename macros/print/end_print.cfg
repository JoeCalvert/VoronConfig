# End of a job, whether it completed or was cancelled. One sequence, so the
# difference between the two is visible in one place.
#   complete: called by END_PRINT (slicer end G-code, after MMU_END)
#   cancel:   called by _CANCEL_PRINT_EXTENSION (Happy Hare's CANCEL_PRINT has
#             already lifted Z, retracted and turned the heaters off)
[gcode_macro _END_JOB]
description: Shared end-of-job sequence. Usage: _END_JOB REASON=complete|cancel
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set reason = params.REASON|default('complete')|lower %}
    {% if reason not in ['complete', 'cancel'] %}
        { action_raise_error("_END_JOB: REASON must be complete or cancel") }
    {% endif %}

    M400
    PARK                             # X before Y: safe even from the Blobifier tray
    TURN_OFF_HEATERS
    _RESTORE_IDLE_TIMEOUT            # PREHEAT may have stretched it
    M107
    BED_MESH_CLEAR
    {% if reason == 'complete' and v.disable_motors_in_end_print %}
        M84
    {% endif %}
    # Lights, LEDs and filter (run-on after a heated-chamber print) for this state
    _SET_STATE STATE={'complete' if reason == 'complete' else 'cancelled'}

    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=phase VALUE="'{'complete' if reason == 'complete' else 'cancelled'}'"
    _MAINTENANCE_ADD FILTER={1 if printer["gcode_macro _JOB"].chamber_temp > 0 else 0}
    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=chamber_temp VALUE=0
    {% if reason == 'cancel' %}
        _OFFER_UNLOAD                # filament stays loaded on a cancel; ask
    {% else %}
        UPDATE_DELAYED_GCODE ID=_PART_READY_WATCH DURATION=30   # "safe to remove" once cool
    {% endif %}

[gcode_macro END_PRINT]
description: End of a completed print (slicer end G-code, after MMU_END): park, heaters off, filter run-on
gcode:
    _END_JOB REASON=complete
