# What happens when a job doesn't end normally.
#
# Failed job. When a command in START_PRINT fails (QGL out of range, Beacon
# contact error, a heater timeout, the nozzle check) or the print hits an
# error, Klipper stops the print and runs [virtual_sdcard] on_error_gcode
# (config/machine.cfg): heaters off, then _JOB_FAILED_LATER a second later.
# Klipper runs on_error_gcode before it records the error message, hence the
# delay. _JOB_FAILED shows the error, the step it was on, and Reprint /
# Heaters off (only if something is still heating) / Unload.
#
# Cancel. A cancel leaves the filament loaded (Happy Hare's
# unload_tool_on_cancel is off, deliberately: the cancel may be because of a
# filament problem). _END_JOB REASON=cancel offers to unload it.

[delayed_gcode _JOB_FAILED_LATER]
gcode:
    _JOB_FAILED

[gcode_macro _JOB_FAILED]
description: Record a failed job and show what happened
gcode:
    {% set job = printer['gcode_macro _JOB'] %}
    {% set step = printer['gcode_macro _SET_STATE'].state %}
    {% set when = 'while starting (step: %s)' % step if job.phase == 'preparing' else
                  'before it started' if job.phase not in ['prepared', 'printing'] else 'while printing' %}
    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=phase VALUE="'failed'"
    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=failed_when VALUE="'{when}'"
    _SET_STATE STATE=failed
    _JOB_FAILED_SHOW
    {% set msg = (printer.print_stats.message|default('')|string)[:120]|replace('#', '')|replace(';', ',')|replace('*', '')|replace('"', "'") %}
    _NOTIFY MSG="Print stopped {when}: {msg}"

[gcode_macro _JOB_FAILED_SHOW]
description: The failed-job dialog (also on MENU after a failure)
gcode:
    {% set ps = printer.print_stats %}
    {% set job = printer['gcode_macro _JOB'] %}
    {% set mmu = printer.mmu|default(None) %}
    # Dialog text can't contain # ; * " or | (see macros/ui/dialog.cfg).
    {% set msg = (ps.message|default('')|string)|replace('\n', '. ')|replace('#', '')|replace(';', ',')|replace('*', '')|replace('"', "'")|replace('|', '/') %}
    {% set hot = printer.extruder.target > 0 or printer.heater_bed.target > 0 %}
    _DIALOG TITLE="Print stopped"
    _DIALOG_TEXT MSG="The print stopped {job.failed_when}."
    {% if msg %}
        _DIALOG_TEXT MSG="Error: {msg}"
    {% endif %}
    {% if hot %}
        _DIALOG_TEXT MSG="The heaters are still on. The idle timeout turns them off after 10 minutes."
    {% endif %}
    {% if ps.filename %}
        _DIALOG_BUTTON LABEL="Reprint" ACTION=_JOB_REPRINT STYLE=primary
    {% endif %}
    {% if hot %}
        _DIALOG_BUTTON LABEL="Turn the heaters off" ACTION=_JOB_HEATERS_OFF
    {% endif %}
    {% if mmu and mmu.enabled and mmu.filament_pos|int != 0 %}
        _DIALOG_BUTTON LABEL="Unload the filament" ACTION=_UNLOAD_NOW
    {% endif %}
    _DIALOG_BUTTON LABEL="Close" ACTION=_DIALOG_CLOSE FOOTER=1
    _DIALOG_SHOW

[gcode_macro _JOB_REPRINT]
description: Start the last file again
gcode:
    _DIALOG_CLOSE
    SDCARD_PRINT_FILE FILENAME="{printer.print_stats.filename}"

[gcode_macro _JOB_HEATERS_OFF]
description: Heaters and part fan off after a failed job
gcode:
    _DIALOG_CLOSE
    TURN_OFF_HEATERS
    _RESTORE_IDLE_TIMEOUT
    M107

[gcode_macro _OFFER_UNLOAD]
description: After a cancel: offer to unload the filament if any is loaded
gcode:
    {% set mmu = printer.mmu|default(None) %}
    {% if mmu and mmu.enabled and mmu.filament_pos|int != 0 %}
        _DIALOG TITLE="Unload the filament?"
        _DIALOG_TEXT MSG="{('T%d is still loaded.' % mmu.tool) if mmu.filament_pos|int == 10 else 'Filament is still part-way in.'} Unloading heats the nozzle, cuts and parks it in its gate."
        _DIALOG_BUTTON LABEL="Unload" ACTION=_UNLOAD_NOW STYLE=primary FOOTER=1
        _DIALOG_BUTTON LABEL="Leave it loaded" ACTION=_DIALOG_CLOSE FOOTER=1
        _DIALOG_SHOW
    {% endif %}

[gcode_macro _UNLOAD_NOW]
description: Unload the filament after a cancelled or failed job, then turn the nozzle off
gcode:
    _DIALOG_CLOSE
    MMU_UNLOAD
    M104 S0
