# START_PRINT prepares the machine. It needs nothing that requires filament in
# the extruder: Happy Hare loads the first tool afterwards. The slicer start
# G-code (docs/slicer.md) runs, in order:
#   M140 (bed starts heating) -> MMU_START_SETUP -> MMU_START_CHECK
#   -> START_PRINT -> MMU_START_LOAD_INITIAL_TOOL -> POST_START_PRINT
# Each step checks the previous one finished (_JOB.phase), so a print can't
# carry on from a half-done start.
#
# Parameters come from the slicer and nothing else:
#   BED       first-layer bed temperature
#   EXTRUDER  first-layer nozzle temperature of the first tool (HOTEND also accepted)
#   CHAMBER   the highest chamber temperature of the filaments the print uses
#             (PrusaSlicer filament setting). Above 0: heat-soak to it, filter on
#   NOZZLE    nozzle diameter the file was sliced for; checked against NOZZLE_SET
#   NOZZLE_TYPE  brass|hf|obxidian the file was sliced for (optional); checked too
#   Z_ADJUST  optional extra Z offset from the slicer (e.g. per build plate)
#
# Preparation finishes with the nozzle hot over the Blobifier tray. A chamber
# wait holds the print file until preparation is complete, before the first tool load.
[gcode_macro START_PRINT]
description: Prepare the machine for a print: validate, initialize, home, heat, probe, finish
gcode:
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    {% set bed = params.BED|default(v.print_default_bed_temp)|float %}
    {% set extruder = params.EXTRUDER|default(params.HOTEND|default(v.print_default_extruder_temp))|float %}
    {% set chamber = params.CHAMBER|default(0)|float %}
    {% set z_adjust = params.Z_ADJUST|default(0)|float %}
    # Preserve the existing cold-bed decision at entry, before homing/heating.
    {% set soak = v.print_default_soak if printer.heater_bed.temperature < bed - 8 else 0 %}

    _START_PRINT_VALIDATE {rawparams}
    _START_PRINT_BEGIN CHAMBER={chamber}
    _START_PRINT_HOME
    _START_PRINT_HEAT BED={bed} EXTRUDER={extruder} CHAMBER={chamber} Z_ADJUST={z_adjust} SOAKTIME={soak}

[gcode_macro _START_PRINT_REQUIRE]
description: Refuse a preparation stage called out of order or after cancellation
gcode:
    {% set job = printer['gcode_macro _JOB'] %}
    {% if job.start_stage != params.STAGE or (params.PREPARING|default(1)|int and job.phase != 'preparing') %}
        { action_raise_error('Print-start stage requires %s while preparing (found stage %s, job %s)' % (params.STAGE, job.start_stage, job.phase)) }
    {% endif %}

[gcode_macro _START_PRINT_VALIDATE]
description: Validate startup checks and slicer nozzle settings before changing the machine
gcode:
    {% set NOZZLE = params.NOZZLE|default(0)|float %}
    {% set NOZZLE_TYPE = params.NOZZLE_TYPE|default('')|lower %}
    {% if printer['gcode_macro _CHAMBER_WAIT'].phase != 'idle' %}
        { action_raise_error('START_PRINT: chamber preparation is already running. Cancel it before starting another job') }
    {% endif %}
    {% if not printer["gcode_macro _STARTUP_CHECK_STATE"].ok %}
        { action_raise_error("START_PRINT: the startup config check found errors (or hasn't run). Run CHECK_CONFIG to see them") }
    {% endif %}
    {% if params.MATERIALS is defined or params.SIZE is defined %}
        { action_raise_error("START_PRINT: this file uses the old slicer start G-code (MATERIALS/SIZE). Update the slicer profile as described in docs/slicer.md") }
    {% endif %}
    {% set fitted = printer.save_variables.variables.nozzle_diameter|default(0)|float %}
    {% if NOZZLE > 0 and fitted > 0 and (NOZZLE - fitted)|abs > 0.01 %}
        { action_raise_error("START_PRINT: file is sliced for a %.2f mm nozzle but a %.2f mm nozzle is fitted. Re-slice, or run NOZZLE_SET if you changed the nozzle" % (NOZZLE, fitted)) }
    {% elif NOZZLE_TYPE and fitted > 0 and NOZZLE_TYPE != printer.save_variables.variables.nozzle_type|default('brass') %}
        { action_raise_error("START_PRINT: file is sliced for a %s nozzle but a %s nozzle is fitted. Pick the matching printer in PrusaSlicer, or run NOZZLE_SET with TYPE if you changed the nozzle" % (NOZZLE_TYPE, printer.save_variables.variables.nozzle_type|default('brass'))) }
    {% elif NOZZLE > 0 and fitted == 0 %}
        RESPOND TYPE=echo MSG="START_PRINT: fitted nozzle unknown. Run NOZZLE_SET DIAMETER={NOZZLE} to enable the nozzle check"
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=start_stage VALUE="'validated'"

[gcode_macro _START_PRINT_BEGIN]
description: Initialize the job and reset state left by the previous print
gcode:
    {% set CHAMBER_TEMP = params.CHAMBER|float %}
    _START_PRINT_REQUIRE STAGE=validated PREPARING=0
    _CHAMBER_ABORT
    UPDATE_DELAYED_GCODE ID=_CANCEL_PARK_LATER DURATION=0
    UPDATE_DELAYED_GCODE ID=_PART_READY_WATCH DURATION=0
    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=phase VALUE="'preparing'"
    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=chamber_temp VALUE={CHAMBER_TEMP}

    CLEAR_PAUSE
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0
    M221 S100
    M220 S100
    G90
    M83

    _SET_STATE STATE=preparing

    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=start_stage VALUE="'initialized'"

[gcode_macro _START_PRINT_HOME]
description: Home before any preparation moves
gcode:
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    _START_PRINT_REQUIRE STAGE=initialized
    {% if v.force_homing_in_start_print %}
        G28 METHOD=proximity CALIBRATE=0
    {% else %}
        _CG28
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=start_stage VALUE="'homed'"

[gcode_macro _START_PRINT_HEAT]
description: Prepare bed/nozzle temperatures and start the optional chamber warm-up and soak
gcode:
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    {% set BED_TEMP = params.BED|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|float %}
    {% set CHAMBER_TEMP = params.CHAMBER|float %}
    {% set Z_ADJUST = params.Z_ADJUST|float %}
    {% set PROBE_TEMP = 150 %}
    _START_PRINT_REQUIRE STAGE=homed
    _SET_STATE STATE={'soaking' if CHAMBER_TEMP > 0 else 'heating'}   # soaking runs the filter to circulate warm air
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={PROBE_TEMP}
    # The orchestrator captures this choice at START_PRINT entry, as before.
    HEATSOAK_BED TEMP={BED_TEMP} SOAKTIME={params.SOAKTIME|int}
    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=start_stage VALUE="'waiting_chamber'"
    {% if CHAMBER_TEMP > 0 %}
        # Hold the SD file while warming/soaking, then finish preparation
        # before allowing the slicer's initial tool load to run.
        HEATSOAK_CHAMBER TEMP={CHAMBER_TEMP} MAXTIME={v.print_default_chamber_max_heating_time} SOAKTIME={v.print_default_chamber_soak} PRINT_START=1 EXTRUDER={EXTRUDER_TEMP} Z_ADJUST={Z_ADJUST}
    {% else %}
        _START_PRINT_AFTER_CHAMBER EXTRUDER={EXTRUDER_TEMP} Z_ADJUST={Z_ADJUST}
    {% endif %}

[gcode_macro _START_PRINT_AFTER_CHAMBER]
description: Continue preparation through probing and final heating after the chamber wait
gcode:
    _START_PRINT_PROBE
    _START_PRINT_FINAL_HEAT {rawparams}

[gcode_macro _START_PRINT_PROBE]
description: Wait for safe nozzle temperature, level, contact-home Z and build the mesh
gcode:
    {% set PROBE_TEMP = 150 %}
    {% if printer['gcode_macro _CHAMBER_WAIT'].phase not in ['idle', 'finishing'] %}
        { action_raise_error('Chamber warm-up/soak is still running') }
    {% endif %}
    _START_PRINT_REQUIRE STAGE=waiting_chamber
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={PROBE_TEMP - 2} MAXIMUM={PROBE_TEMP + 2}

    # Level and zero Z
    _SET_STATE STATE=leveling        # filter off until printing
    COARSE_QGL                       # proximity, at a safe height, in case the gantry is far out
    BLOBIFIER_CLEAN                  # clean nozzle before touching the bed
    _SET_STATE STATE=calibrating_z
    BEACON_HOME_Z_CONTACT CALIBRATE=1
    _SET_STATE STATE=leveling
    QUAD_GANTRY_LEVEL horizontal_move_z=2
    _SET_STATE STATE=calibrating_z
    BEACON_HOME_Z_CONTACT            # QGL moved Z; still clean at 150 C, so no second wipe

    # Mesh only the area being printed (slicer object labels)
    _SET_STATE STATE=meshing
    BED_MESH_CALIBRATE ADAPTIVE=1    # passes: mesh_runs in the [beacon] section

    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=start_stage VALUE="'probed'"

[gcode_macro _START_PRINT_FINAL_HEAT]
description: Heat over the tray, apply offsets and mark the job ready for the first tool load
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER|float %}
    {% set Z_ADJUST = params.Z_ADJUST|default(0)|float %}
    {% set hot_offset = printer['gcode_macro _BEACON_VARS'].hot_nozzle_offset|float %}
    _START_PRINT_REQUIRE STAGE=probed
    _SET_STATE STATE=heating
    BLOBIFIER_PARK
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP} MAXIMUM={EXTRUDER_TEMP + 2}

    # Hot-nozzle expansion, then any slicer Z adjustment
    SET_GCODE_OFFSET Z={hot_offset} MOVE=1
    SET_GCODE_OFFSET Z_ADJUST={Z_ADJUST} MOVE=1

    M83
    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=phase VALUE="'prepared'"
    SET_GCODE_VARIABLE MACRO=_JOB VARIABLE=start_stage VALUE="'prepared'"


# Records which nozzle is fitted, so START_PRINT can refuse a file sliced for a
# different one. Run it after every nozzle swap. Stored in Happy Hare's
# save_variables file (mmu/mmu_vars.cfg), the printer's only one.
[gcode_macro NOZZLE_SET]
description: Record the fitted nozzle. Usage: NOZZLE_SET DIAMETER=0.6 [TYPE=brass|hf|obxidian]
gcode:
    {% set sv = printer.save_variables.variables %}
    {% if params.DIAMETER is not defined %}
        {% set fitted = sv.nozzle_diameter|default(0)|float %}
        RESPOND MSG="Fitted nozzle: {('%.2f mm %s' % (fitted, sv.nozzle_type|default('brass'))) if fitted > 0 else 'not set'}. Usage: NOZZLE_SET DIAMETER=0.6 TYPE=hf"
    {% else %}
        {% set d = params.DIAMETER|float %}
        {% set t = params.TYPE|default('brass')|lower %}
        {% if d < 0.1 or d > 2.0 %}
            { action_raise_error("NOZZLE_SET: %.2f mm is not a plausible nozzle diameter" % d) }
        {% endif %}
        {% if t not in ['brass', 'hf', 'obxidian'] %}
            { action_raise_error("NOZZLE_SET: TYPE must be brass, hf or obxidian") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=nozzle_diameter VALUE={d}
        SAVE_VARIABLE VARIABLE=nozzle_type VALUE="'{t}'"
        RESPOND MSG="Fitted nozzle set to {'%.2f' % d} mm {t}"
    {% endif %}

[gcode_macro _NOZZLE_KEY]
description: Helper holding how the fitted nozzle is named for tuning results (0.60_hf), as in slicer/profiles.py
variable_suffix: {'brass': '', 'hf': '_hf', 'obxidian': '_obx'}
gcode:
    {% set sv = printer.save_variables.variables %}
    RESPOND MSG="{'%.2f' % sv.nozzle_diameter|default(0)|float}{printer['gcode_macro _NOZZLE_KEY'].suffix[sv.nozzle_type|default('brass')]}"
