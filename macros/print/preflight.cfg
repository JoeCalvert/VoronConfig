# PREFLIGHT_CHECK: before START_PRINT, compare what the file was sliced for
# with what is in the MMU.
#
# In the slicer start G-code after MMU_START_CHECK (docs/slicer.md). Happy
# Hare's automap ('filament_name') maps each tool to the gate with the same
# filament name, and MMU_START_CHECK pauses if a gate is empty. What neither
# catches is a tool left on a gate holding a different filament, because
# automap found no match. That's the "wrong spool in gate 3" print.
#
# For each tool the print uses: the gate must not be empty, and where both
# are known, the material and filament name must match the slicer's. If
# anything differs the print pauses before START_PRINT, with a dialog
# listing the problems: Check again / Start anyway / Cancel. The bed keeps
# heating meanwhile (the start G-code's M140).

[gcode_macro PREFLIGHT_CHECK]
description: Check the MMU holds what the file was sliced for; pause with a dialog if not. Usage: PREFLIGHT_CHECK [RECHECK=1]
gcode:
    {% set mmu = printer.mmu|default(None) %}
    {% if mmu and mmu.enabled and mmu.tool != -2 %}
        {% set stm = mmu.slicer_tool_map %}
        {% set problems = [] %}
        {% for t in stm.referenced_tools %}
            {% set want = stm.tools[t|string]|default({}) %}
            {% set g = mmu.ttg_map[t] %}
            {% set want_mat = want.material|default('')|upper %}
            {% set want_name = want.name|default('')|lower %}
            {% set have_mat = mmu.gate_material[g]|default('')|upper %}
            {% set have_name = mmu.gate_filament_name[g]|default('')|lower %}
            {% if mmu.gate_status[g] == 0 %}
                {% set _ = problems.append('T%d: gate %d is empty' % (t, g)) %}
            {% elif (want_mat and have_mat and want_mat != have_mat) or (want_name and have_name and want_name != have_name) %}
                {% set _ = problems.append('T%d: sliced for %s %s, gate %d has %s %s' % (t, want_mat, want.name|default(''), g, have_mat, mmu.gate_filament_name[g])) %}
            {% endif %}
        {% endfor %}

        {% if problems %}
            _DIALOG TITLE="Check the filament"
            _DIALOG_TEXT MSG="The MMU doesn't hold what this file was sliced for:"
            {% for p in problems %}
                _DIALOG_TEXT MSG="{p|replace('#', '')|replace(';', '')|replace('*', '')|replace('"', '')|replace('|', '')}"
            {% endfor %}
            _DIALOG_TEXT MSG="Swap the spool or remap the tool (MMU panel), then Check again."
            _DIALOG_BUTTON LABEL="Check again" ACTION="PREFLIGHT_CHECK RECHECK=1" STYLE=primary
            _DIALOG_BUTTON LABEL="Start anyway" ACTION=_PREFLIGHT_CONTINUE FOOTER=1 STYLE=warning
            _DIALOG_BUTTON LABEL="Cancel print" ACTION="_CONFIRM_CANCEL BACK=_PREFLIGHT_BACK" FOOTER=1 STYLE=error
            _DIALOG_SHOW
            {% if not params.RECHECK %}
                PAUSE
                _NOTIFY MSG="Print waiting: the MMU doesn't hold what the file was sliced for"
            {% endif %}
        {% elif params.RECHECK %}
            _PREFLIGHT_CONTINUE
        {% endif %}
    {% endif %}

[gcode_macro _PREFLIGHT_CONTINUE]
description: Carry on with the print start after PREFLIGHT_CHECK
gcode:
    _DIALOG_CLOSE
    RESUME

[gcode_macro _PREFLIGHT_BACK]
description: Back to the preflight dialog (checks again; carries on if it's now fine)
gcode:
    PREFLIGHT_CHECK RECHECK=1
