# "Safe to remove": after a completed print, wait for the bed to cool below
# part_ready_bed_temp, then show the part-ready LEDs and send a notification.
# Stops as soon as another job starts.

[delayed_gcode _PART_READY_WATCH]
gcode:
    _PART_READY_CHECK

[gcode_macro _PART_READY_CHECK]
description: After a completed print: part-ready once the bed has cooled
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% if printer["gcode_macro _JOB"].phase == 'complete' %}
        {% if printer.heater_bed.temperature < v.part_ready_bed_temp %}
            _SET_STATE STATE=part_ready
            _NOTIFY MSG="Print finished and the bed is below {v.part_ready_bed_temp}°C: safe to take the part off."
        {% else %}
            UPDATE_DELAYED_GCODE ID=_PART_READY_WATCH DURATION=30
        {% endif %}
    {% endif %}
