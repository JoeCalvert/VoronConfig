# MENU: one entry point for the everyday jobs, as a dialog.
#
# It's on KlipperScreen's main screen (KlipperScreen.conf) and in Fluidd's
# macro list. Each later workflow adds its button here, so this stays the one
# place to look.
#
# Quick toggles (lights, filter) leave the menu open. Buttons that start a
# workflow open that workflow's own dialog in its place.

[gcode_macro MENU]
description: Open the printer menu
gcode:
    {% set vars = printer['gcode_macro _USER_VARIABLES'] %}
    {% set nozzle = printer.save_variables.variables.nozzle_diameter|default(None) %}
    {% set chamber = printer['temperature_sensor ' ~ vars.chamber_temperature_sensor_name]|default(None) %}
    {% set mmu = printer.mmu|default(None) %}

    {% set facts = [] %}
    {% set _ = facts.append('Nozzle ' ~ (('%.2f mm' % nozzle) if nozzle else 'not recorded')) %}
    {% if chamber %}
        {% set _ = facts.append('Chamber %.0f°C' % chamber.temperature) %}
    {% endif %}
    {% if mmu and mmu.enabled %}
        {% if mmu.tool >= 0 and mmu.filament == 'Loaded' %}
            {% set _ = facts.append('T%d loaded' % mmu.tool) %}
        {% else %}
            {% set _ = facts.append('MMU: nothing loaded') %}
        {% endif %}
    {% endif %}

    _DIALOG TITLE="Printer menu"
    _DIALOG_TEXT MSG="{facts|join('  -  ')}"
    {% set check = printer['gcode_macro _STARTUP_CHECK_STATE'] %}
    {% if check.ran and not check.ok %}
        _DIALOG_TEXT MSG="CHECK_CONFIG found problems, so START_PRINT is blocked."
    {% endif %}

    {% if printer['gcode_macro _JOB'].phase == 'failed' %}
        _DIALOG_BUTTON LABEL="Why did the last print stop?" ACTION=_JOB_FAILED_SHOW STYLE=warning
    {% endif %}
    {% if mmu and mmu.enabled and mmu.print_state in ['pause_locked', 'paused'] %}
        _DIALOG_BUTTON LABEL="MMU recovery" ACTION=_MMU_RECOVERY STYLE=primary
    {% elif mmu and mmu.enabled %}
        _DIALOG_BUTTON LABEL="MMU check-up" ACTION=MMU_CHECKUP
    {% endif %}

    {% if printer.print_stats.state not in ['printing', 'paused'] %}
        _DIALOG_BUTTON LABEL="Preheat" ACTION=_PREHEAT_MENU
        _DIALOG_ROW
        {% if mmu and mmu.enabled %}
            _DIALOG_BUTTON LABEL="Change a spool" ACTION=SPOOL_SWAP
        {% endif %}
        _DIALOG_BUTTON LABEL="Change the nozzle" ACTION=NOZZLE_CHANGE
        _DIALOG_ROW_END
    {% endif %}
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Lights on" ACTION=LIGHT_ON
    _DIALOG_BUTTON LABEL="Lights off" ACTION=LIGHT_OFF
    _DIALOG_ROW_END
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Filter on" ACTION=START_FILTER
    _DIALOG_BUTTON LABEL="Filter off" ACTION=STOP_FILTER
    _DIALOG_ROW_END
    _DIALOG_ROW
    _DIALOG_BUTTON LABEL="Park" ACTION=_MENU_PARK
    _DIALOG_BUTTON LABEL="Service position" ACTION=SERVICE_POSITION
    _DIALOG_ROW_END
    _DIALOG_BUTTON LABEL="Check config" ACTION=CHECK_CONFIG

    _DIALOG_BUTTON LABEL="Close" ACTION=_DIALOG_CLOSE FOOTER=1
    _DIALOG_SHOW

[gcode_macro _MENU_PARK]
description: Home if needed, then park
gcode:
    _CG28
    PARK
