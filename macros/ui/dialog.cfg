# Dialog helpers: pop-up prompts shown by Fluidd, KlipperScreen and Mainsail.
#
# All three render the same "action:prompt_*" messages, so a dialog is written
# once and looks the same on the touchscreen and in the browser. These helpers
# are the only place that writes that protocol.
#
#   _DIALOG TITLE="Preheat"
#   _DIALOG_TEXT MSG="Heat the bed and chamber for the loaded filament?"
#   _DIALOG_ROW
#   _DIALOG_BUTTON LABEL="PLA" ACTION="PREHEAT MATERIAL=PLA"
#   _DIALOG_BUTTON LABEL="ABS" ACTION="PREHEAT MATERIAL=ABS" STYLE=primary
#   _DIALOG_ROW_END
#   _DIALOG_BUTTON LABEL="Back" ACTION=MENU FOOTER=1
#   _DIALOG_SHOW
#
# Rules for what goes in a dialog:
# - No '#', ';' or '*' anywhere: Klipper treats them as the start of a comment
#   and cuts the line there. No double quotes, and no '|' in labels or actions.
# - A button's ACTION is one G-code line. Make it a macro that either opens the
#   next dialog or calls _DIALOG_CLOSE, so the old dialog never lingers.
# - STYLE is one of primary, secondary, info, warning, error.

[gcode_macro _DIALOG]
description: Start a dialog, replacing any open one. TITLE=<text>
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin {params.TITLE|default('Voron')}"

[gcode_macro _DIALOG_TEXT]
description: Add a line of text to the dialog being built. MSG=<text>
gcode:
    RESPOND TYPE=command MSG="action:prompt_text {params.MSG|default('')}"

[gcode_macro _DIALOG_BUTTON]
description: Add a button. LABEL=<text> ACTION=<gcode> [STYLE=<style>] [FOOTER=1]
gcode:
    {% set label = params.LABEL|default('OK')|replace('|', '/') %}
    {% set action = params.ACTION|default(label) %}
    {% set style = params.STYLE|default('')|lower %}
    {% set kind = 'prompt_footer_button' if params.FOOTER|default(0)|int else 'prompt_button' %}
    {% if style not in ['', 'primary', 'secondary', 'info', 'warning', 'error'] %}
        { action_raise_error("_DIALOG_BUTTON: unknown STYLE '%s'" % style) }
    {% endif %}
    RESPOND TYPE=command MSG="action:{kind} {label}|{action}{('|' ~ style) if style else ''}"

[gcode_macro _DIALOG_ROW]
description: Put the following buttons on one row, until _DIALOG_ROW_END
gcode:
    RESPOND TYPE=command MSG="action:prompt_button_group_start"

[gcode_macro _DIALOG_ROW_END]
description: End a row of buttons
gcode:
    RESPOND TYPE=command MSG="action:prompt_button_group_end"

[gcode_macro _DIALOG_SHOW]
description: Show the dialog that has been built
gcode:
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DIALOG_CLOSE]
description: Close any open dialog
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
