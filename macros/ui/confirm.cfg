[gcode_macro _CONFIRM_CANCEL]
description: Ask before cancelling the print. BACK=<macro that re-opens the previous dialog>
gcode:
    _DIALOG TITLE="Cancel the print?"
    _DIALOG_TEXT MSG="This ends the print. It can't be undone."
    _DIALOG_BUTTON LABEL="No, go back" ACTION={params.BACK|default('_DIALOG_CLOSE')} FOOTER=1
    _DIALOG_BUTTON LABEL="Yes, cancel the print" ACTION=_CANCEL_NOW FOOTER=1 STYLE=error
    _DIALOG_SHOW

[gcode_macro _CANCEL_NOW]
description: Close the dialog and cancel the print
gcode:
    _DIALOG_CLOSE
    CANCEL_PRINT
