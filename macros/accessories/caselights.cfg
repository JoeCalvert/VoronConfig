[gcode_macro LIGHT_OFF]
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}

    SET_LED LED={v.light_pin_name} WHITE=0.0


[gcode_macro LIGHT_ON]
gcode:
    {% set S = params.S|default(1.0)|float %}
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}

    SET_LED LED={v.light_pin_name} WHITE={S}