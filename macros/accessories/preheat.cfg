# PREHEAT: warm the machine up ahead of a print, from MENU or the console.
#
# Bed to the material's temperature, nozzle to 150 (no oozing), and for a
# chamber material the filter on full to circulate the warm air (machine
# state 'soaking'). Nothing waits, so you can slice while it heats. The idle
# timeout is stretched to preheat_max_minutes, so the heaters don't go off
# after Klipper's usual 10 minutes; anything that ends a job puts it back.
#
# Temperatures are by material, in config/variables.cfg (preheat_materials).

[gcode_macro PREHEAT]
description: Warm up the bed (and chamber) for a material. Usage: PREHEAT [MATERIAL=ABS] (default: the loaded filament)
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set table = v.preheat_materials %}
    {% set mmu = printer.mmu|default(None) %}
    {% set loaded = mmu.gate_material[mmu.gate]|default('')|upper if mmu and mmu.enabled and mmu.gate >= 0 else '' %}
    {% set mat = (params.MATERIAL|default(loaded))|upper %}
    {% if mat not in table %}
        { action_raise_error("PREHEAT: no preheat temperatures for '%s'. Use MATERIAL= one of %s (preheat_materials in config/variables.cfg)" % (mat, table.keys()|list|join(', '))) }
    {% endif %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("PREHEAT: a print is running") }
    {% endif %}
    {% set bed, chamber = table[mat] %}

    _DIALOG_CLOSE
    SET_IDLE_TIMEOUT TIMEOUT={v.preheat_max_minutes * 60}
    M140 S{bed}
    M104 S{v.preheat_nozzle_temp}
    _SET_STATE STATE={'soaking' if chamber > 0 else 'heating'}
    RESPOND MSG="Preheating for {mat}: bed {bed}°C, nozzle {v.preheat_nozzle_temp}°C{', filter on to warm the chamber towards %d°C' % chamber if chamber > 0 else ''}. Heaters stay on for {v.preheat_max_minutes} minutes."

[gcode_macro PREHEAT_OFF]
description: Stop preheating: heaters and filter off
gcode:
    _DIALOG_CLOSE
    TURN_OFF_HEATERS
    STOP_FILTER
    _RESTORE_IDLE_TIMEOUT
    _SET_STATE STATE=idle

[gcode_macro _RESTORE_IDLE_TIMEOUT]
description: Put the idle timeout back to the configured value (PREHEAT stretches it)
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={(printer.configfile.settings.idle_timeout|default({})).timeout|default(600)}

[gcode_macro _PREHEAT_MENU]
description: Preheat dialog (from MENU)
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set mmu = printer.mmu|default(None) %}
    {% set loaded = mmu.gate_material[mmu.gate]|default('')|upper if mmu and mmu.enabled and mmu.gate >= 0 else '' %}
    {% set heating = printer.heater_bed.target > 0 %}
    _DIALOG TITLE="Preheat"
    {% if heating %}
        _DIALOG_TEXT MSG="Bed {printer.heater_bed.temperature|round|int}/{printer.heater_bed.target|round|int}°C, chamber {printer['temperature_sensor ' ~ v.chamber_temperature_sensor_name].temperature|round|int}°C."
    {% endif %}
    {% if loaded in v.preheat_materials %}
        _DIALOG_BUTTON LABEL="For the loaded {loaded} (gate {mmu.gate})" ACTION="PREHEAT MATERIAL={loaded}" STYLE=primary
    {% endif %}
    _DIALOG_ROW
    {% for m in v.preheat_materials %}
        _DIALOG_BUTTON LABEL="{m}" ACTION="PREHEAT MATERIAL={m}"
    {% endfor %}
    _DIALOG_ROW_END
    {% if heating %}
        _DIALOG_BUTTON LABEL="Heaters off" ACTION=PREHEAT_OFF FOOTER=1 STYLE=error
    {% endif %}
    _DIALOG_BUTTON LABEL="Back" ACTION=MENU FOOTER=1
    _DIALOG_SHOW
