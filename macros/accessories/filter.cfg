[gcode_macro START_FILTER]
description: Filter fan on. Usage: START_FILTER [SPEED=0.0-1.0]
gcode:
    {% set SPEED = params.SPEED|default(1)|float %}

    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    SET_FAN_SPEED FAN={v.filter_name} SPEED={SPEED}


[gcode_macro STOP_FILTER]
description: Filter fan off
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    SET_FAN_SPEED FAN={v.filter_name} SPEED=0


[delayed_gcode _STOP_FILTER_DELAYED]
gcode:
    STOP_FILTER
