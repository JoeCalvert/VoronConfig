# Non-blocking chamber warm-up followed by a timed soak. M25 holds only the
# print-file reader: it is not a user/MMU pause, and does not park or retract.
# Each timer tick releases Klipper's command lock, so CANCEL_PRINT can run.
[gcode_macro HEATSOAK_CHAMBER]
description: Warm towards TEMP, detect a plateau, then soak. Usage: HEATSOAK_CHAMBER TEMP=50 [SOAKTIME=5] [MAXTIME=15]
gcode:
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    {% set w = printer['gcode_macro _CHAMBER_WAIT'] %}
    {% set target = params.TEMP|default(0)|float %}
    {% set soak = params.SOAKTIME|default(v.print_default_chamber_soak)|float %}
    {% set maximum = params.MAXTIME|default(v.print_default_chamber_max_heating_time)|float %}
    {% if w.phase != 'idle' or printer.pause_resume.is_paused %}
        { action_raise_error('A chamber wait or user pause is already active') }
    {% endif %}
    {% if not (0 < target <= 120 and 0 <= soak <= 120 and 0 <= maximum <= 120) %}
        { action_raise_error('HEATSOAK_CHAMBER: TEMP must be positive, SOAKTIME and MAXTIME must be 0..120 minutes') }
    {% endif %}
    {% if printer.toolhead.homed_axes != 'xyz' or printer.heater_bed.target <= 0 %}
        { action_raise_error('HEATSOAK_CHAMBER needs homed axes and the bed heater on') }
    {% endif %}
    {% set sx, sy, sz = v.chamber_soak_position_xyz|map('float') %}
    {% set now = printer.toolhead.estimated_print_time %}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=phase VALUE="'positioning'"
    UPDATE_DELAYED_GCODE ID=_CHAMBER_FINISH_WATCH DURATION=1
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=target VALUE={target}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=soak_seconds VALUE={soak * 60}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=started VALUE={now}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=deadline VALUE={now + maximum * 60}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=last_tick VALUE={now}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=samples VALUE="[]"
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=peak_rate VALUE=0
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=print_start VALUE={params.PRINT_START|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=extruder VALUE={params.EXTRUDER|default(0)|float}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=z_adjust VALUE={params.Z_ADJUST|default(0)|float}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=sd_held VALUE={printer.virtual_sdcard.is_active}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=filename VALUE={printer.print_stats.filename|tojson|tojson}
    {% if printer.virtual_sdcard.is_active %}
        M25
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT={[600, (maximum + soak) * 60 + 120]|max}
    SAVE_GCODE_STATE NAME=_chamber_park
    G90
    {% if sz > printer.gcode_move.gcode_position.z %}
        G0 Z{sz} F{v.z_drop_speed * 60}
    {% endif %}
    # Leave the tray sideways before moving towards the front of the machine.
    G0 X{sx} F{v.travel_speed * 60}
    G0 Y{sy} F{v.travel_speed * 60}
    G0 Z{sz} F{v.z_drop_speed * 60}
    RESTORE_GCODE_STATE NAME=_chamber_park
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=phase VALUE="'warming'"
    UPDATE_DELAYED_GCODE ID=_CHAMBER_FINISH_WATCH DURATION=0
    _SET_STATE STATE=soaking
    RESPOND MSG="Chamber warm-up to {target} C, then {soak} minutes soaking"
    UPDATE_DELAYED_GCODE ID=_CHAMBER_TIMER DURATION=0.1

[gcode_macro _CHAMBER_WAIT]
description: State of the current chamber warm-up and soak
variable_phase: 'idle'
variable_target: 0
variable_soak_seconds: 0
variable_started: 0
variable_deadline: 0
variable_last_tick: 0
variable_samples: []
variable_peak_rate: 0
variable_print_start: 0
variable_extruder: 0
variable_z_adjust: 0
variable_sd_held: False
variable_filename: ''
gcode:

[delayed_gcode _CHAMBER_TIMER]
gcode:
    _CHAMBER_TICK

[gcode_macro _CHAMBER_TICK]
description: Sample chamber temperature without blocking other commands
gcode:
    {% set w = printer['gcode_macro _CHAMBER_WAIT'] %}
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    {% set now = printer.toolhead.estimated_print_time %}
    {% set temp = printer['temperature_sensor ' ~ v.chamber_temperature_sensor_name].temperature|float %}
    {% if w.phase not in ['warming', 'soaking'] %}
        # Cancelled/finished: an already queued tick must do nothing.
    {% elif printer.heater_bed.target <= 0 or (w.sd_held and (printer.print_stats.filename != w.filename or printer.print_stats.state in ['cancelled', 'error', 'complete', 'standby'])) %}
        _CHAMBER_ABORT
        TURN_OFF_HEATERS
        RESPOND MSG="Chamber wait stopped: heater off or print no longer active"
        {% if w.print_start %}
            _JOB_FAILED
        {% else %}
            STOP_FILTER
            _SET_STATE STATE=idle
        {% endif %}
    {% elif printer.pause_resume.is_paused %}
        # A deliberate user pause freezes both clocks. Discard the trend:
        # PAUSE/RESUME may have moved the toolhead-mounted chamber sensor.
        SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=deadline VALUE={w.deadline + now - w.last_tick}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=started VALUE={now}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=samples VALUE="[]"
        SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=peak_rate VALUE=0
        SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=last_tick VALUE={now}
        UPDATE_DELAYED_GCODE ID=_CHAMBER_TIMER DURATION=30
    {% elif w.phase == 'soaking' %}
        {% if now >= w.deadline %}
            _CHAMBER_FINISH
        {% else %}
            SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=last_tick VALUE={now}
            UPDATE_DELAYED_GCODE ID=_CHAMBER_TIMER DURATION={ [30, w.deadline - now]|min }
        {% endif %}
    {% elif temp >= w.target %}
        _CHAMBER_BEGIN_SOAK REASON=target
    {% elif now >= w.deadline %}
        _CHAMBER_BEGIN_SOAK REASON=timeout
    {% else %}
        # Allow a minute for the moving sensor to settle. Three averaged
        # groups spanning six minutes reject brief sensor fluctuations. Compare
        # two successive rates with the fastest observed rate: no curve fit,
        # room sensor or per-material tuning. A steady positive ramp keeps
        # waiting; a sustained near-zero rise can also plateau from the outset.
        {% set samples = (w.samples + [[now, temp]])[-13:] if now - w.started >= 60 else [] %}
        {% set ns = namespace(plateau=False, peak=w.peak_rate) %}
        {% if samples|length == 13 %}
            {% set a = samples[:3] %}
            {% set b = samples[5:8] %}
            {% set c = samples[-3:] %}
            {% set at = a|map(attribute=0)|sum / 3 %}
            {% set bt = b|map(attribute=0)|sum / 3 %}
            {% set ct = c|map(attribute=0)|sum / 3 %}
            {% set av = a|map(attribute=1)|sum / 3 %}
            {% set bv = b|map(attribute=1)|sum / 3 %}
            {% set cv = c|map(attribute=1)|sum / 3 %}
            {% set early = (bv - av) * 60 / (bt - at) %}
            {% set recent = (cv - bv) * 60 / (ct - bt) %}
            {% set ns.peak = [ns.peak, early, recent]|max %}
            {% set small = [0.05, ns.peak * 0.1]|max %}
            {% set ns.plateau = -0.05 <= early <= small and -0.05 <= recent <= small %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=samples VALUE="{samples}"
        SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=peak_rate VALUE={ns.peak}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=last_tick VALUE={now}
        {% if ns.plateau %}
            _CHAMBER_BEGIN_SOAK REASON=plateau
        {% else %}
            UPDATE_DELAYED_GCODE ID=_CHAMBER_TIMER DURATION={ [30, w.deadline - now]|min }
        {% endif %}
    {% endif %}

[gcode_macro _CHAMBER_BEGIN_SOAK]
description: Enter the timed soak after reaching target, a plateau, or the warm-up limit
gcode:
    {% set w = printer['gcode_macro _CHAMBER_WAIT'] %}
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    {% set temp = printer['temperature_sensor ' ~ v.chamber_temperature_sensor_name].temperature|float %}
    {% if params.REASON != 'target' %}
        RESPOND MSG="WARNING: chamber {temp|round(1)} C / {w.target} C, {'warming has flattened' if params.REASON == 'plateau' else 'maximum warm-up time reached'}. Soaking at the achieved temperature, then continuing."
    {% else %}
        RESPOND MSG="Chamber target reached: {temp|round(1)} C"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=phase VALUE="'soaking'"
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=deadline VALUE={printer.toolhead.estimated_print_time + w.soak_seconds}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=last_tick VALUE={printer.toolhead.estimated_print_time}
    UPDATE_DELAYED_GCODE ID=_CHAMBER_TIMER DURATION={ [30, [0.1, w.soak_seconds]|max]|min }

[gcode_macro _CHAMBER_FINISH]
description: Finish preparation, then release the held print file
gcode:
    {% set w = printer['gcode_macro _CHAMBER_WAIT'] %}
    {% if w.phase == 'soaking' %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=phase VALUE="'finishing'"
        # Delayed scripts do not invoke virtual_sdcard.on_error_gcode. Arm a
        # watchdog before the continuation: if any command fails, it switches
        # heaters off and reports the failed preparation after the lock clears.
        UPDATE_DELAYED_GCODE ID=_CHAMBER_FINISH_WATCH DURATION=1
        {% if w.print_start %}
            _START_PRINT_AFTER_CHAMBER EXTRUDER={w.extruder} Z_ADJUST={w.z_adjust}
        {% endif %}
        _CHAMBER_RELEASE
    {% endif %}

[gcode_macro _CHAMBER_RELEASE]
description: Resume the file only after preparation completed successfully
gcode:
    {% set w = printer['gcode_macro _CHAMBER_WAIT'] %}
    {% if w.phase == 'finishing' and (not w.print_start or printer['gcode_macro _JOB'].phase == 'prepared') %}
        _RESTORE_IDLE_TIMEOUT
        UPDATE_DELAYED_GCODE ID=_CHAMBER_FINISH_WATCH DURATION=0
        SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=phase VALUE="'idle'"
        SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=sd_held VALUE=False
        RESPOND MSG="Chamber soak complete"
        {% if w.sd_held and printer.print_stats.filename == w.filename and not printer.virtual_sdcard.is_active and printer.print_stats.state == 'paused' and not printer.pause_resume.is_paused %}
            M24
        {% endif %}
    {% endif %}

[delayed_gcode _CHAMBER_FINISH_WATCH]
gcode:
    _CHAMBER_FINISH_FAILED

[gcode_macro _CHAMBER_FINISH_FAILED]
description: Clean up an error in the timer-driven print-start continuation
gcode:
    {% if printer['gcode_macro _CHAMBER_WAIT'].phase in ['positioning', 'finishing'] %}
        TURN_OFF_HEATERS
        M107
        _CHAMBER_ABORT
        _JOB_FAILED
        RESPOND TYPE=error MSG="Print preparation failed after the chamber soak. See the preceding console error. Cancel before retrying."
    {% endif %}

[gcode_macro _CHAMBER_ABORT]
description: Invalidate chamber callbacks on cancel, failure or a new start
gcode:
    UPDATE_DELAYED_GCODE ID=_CHAMBER_TIMER DURATION=0
    UPDATE_DELAYED_GCODE ID=_CHAMBER_FINISH_WATCH DURATION=0
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=phase VALUE="'idle'"
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=samples VALUE="[]"
    _RESTORE_IDLE_TIMEOUT

[gcode_macro HEATSOAK_BED]
description: Heat the bed to TEMP, then soak SOAKTIME minutes parked at soak_position_xyz. Usage: HEATSOAK_BED TEMP=100 [SOAKTIME=8]
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set SETPOINT_TEMP = params.TEMP|default(0)|int %}
    {% set TIME = params.SOAKTIME|default(8)|int %}

    {% set sx, sy, sz = v.soak_position_xyz|map('float') %}

    RESPOND MSG="Heating up bed..."

    M190 S{SETPOINT_TEMP}

    {% if TIME > 0 %}
        SAVE_GCODE_STATE NAME=_heatsoak_bed
        G90
        G0 X{sx} Y{sy} F{v.travel_speed * 60}
        G0 Z{sz} F{v.z_drop_speed * 60}
        {% for _ in range(0, TIME) %}
            RESPOND MSG="Heatsoak..."
            G4 P{60000 * 1}
        {% endfor %}
        RESTORE_GCODE_STATE NAME=_heatsoak_bed
    {% else %}
        RESPOND MSG="No heatsoak needed, continue"
    {% endif %}
    
    RESPOND MSG="Bed temperature OK"
