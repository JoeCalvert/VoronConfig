[gcode_macro HEATSOAK_CHAMBER]
description: Wait for the chamber to reach TEMP, at most MAXTIME minutes, parked at chamber_soak_position_xyz. Usage: HEATSOAK_CHAMBER TEMP=40 [MAXTIME=15]
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set SETPOINT_TEMP = params.TEMP|default(0)|float %}
    {% set MAXTIME = params.MAXTIME|default(v.print_default_chamber_max_heating_time)|int %}

    {% for _ in range(MAXTIME) %}
        _WAIT_CHAMBER_TEMP TEMP={SETPOINT_TEMP}
    {% endfor %}
    RESPOND MSG="Chamber temperature OK !"


[gcode_macro _WAIT_CHAMBER_TEMP]
description: One minute of HEATSOAK_CHAMBER (a separate macro so Klipper re-reads the temperature each time)
# This macro is needed to allow klipper populate a new value in the printer[...].temperature variable
# as each variables are populated only once at the beginning of every macro call
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    # The chamber thermistor is on the toolhead, so wait well away from the hot
    # bed or it reads the bed instead of the air.
    {% set sx, sy, sz = v.chamber_soak_position_xyz|map('float') %}

    {% set SETPOINT_TEMP = params.TEMP|default(0)|float %}
    {% set CURRENT_TEMP = printer["temperature_sensor " ~ v.chamber_temperature_sensor_name].temperature|float %}

    {% if CURRENT_TEMP <= SETPOINT_TEMP %}
        SAVE_GCODE_STATE NAME=_wait_chamber
        G90
        {% if sz > printer.toolhead.position.z %}
            G0 Z{sz} F{v.z_drop_speed * 60}    # going up: lift first
            G0 X{sx} Y{sy} F{v.travel_speed * 60}
        {% else %}
            G0 X{sx} Y{sy} F{v.travel_speed * 60}
            G0 Z{sz} F{v.z_drop_speed * 60}
        {% endif %}
        RESPOND MSG="Heating up the chamber : {CURRENT_TEMP}/{SETPOINT_TEMP}"
        G4 P{60000 * 1} # wait a minute and check again if called in a loop
        RESTORE_GCODE_STATE NAME=_wait_chamber
    {% endif %}


[gcode_macro HEATSOAK_BED]
description: Heat the bed to TEMP, then soak SOAKTIME minutes parked at soak_position_xyz. Usage: HEATSOAK_BED TEMP=100 [SOAKTIME=8]
gcode:
    {% set v = printer["gcode_macro _USER_VARIABLES"] %}
    {% set SETPOINT_TEMP = params.TEMP|default(0)|int %}
    {% set TIME = params.SOAKTIME|default(8)|int %}

    {% set sx, sy, sz = v.soak_position_xyz|map('float') %}

    RESPOND MSG="Heating up bed..."

    M190 S{SETPOINT_TEMP}

    {% if TIME > 0 %}
        SAVE_GCODE_STATE NAME=_heatsoak_bed
        G90
        G0 X{sx} Y{sy} F{v.travel_speed * 60}
        G0 Z{sz} F{v.z_drop_speed * 60}
        {% for _ in range(0, TIME) %}
            RESPOND MSG="Heatsoak..."
            G4 P{60000 * 1}
        {% endfor %}
        RESTORE_GCODE_STATE NAME=_heatsoak_bed
    {% else %}
        RESPOND MSG="No heatsoak needed, continue"
    {% endif %}
    
    RESPOND MSG="Bed temperature OK"